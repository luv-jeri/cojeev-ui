<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cojeev — three ways to arrive</title>
<style>
:root{--paper:#fbf4e6;--ink:#242126;--muted:#70665f;--edge:#ddd2c1;--wash:#f3e6d7;--pink:#f5b8db;--blue:#b6caeb;--olive:#9aab63;--yellow:#f5d867;--field-a:#f0b298;--field-b:#d7b6cf;--field-c:#f0d9ae;--tray:#e6e3cf;color-scheme:light}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}body.dark{--paper:#171512;--ink:#f6efe2;--muted:#b5ac9e;--edge:#3a352e;--wash:#221f1b;--field-a:#606080;--field-b:#8d7dca;--field-c:#212121;--tray:#302d38;color-scheme:dark}header{max-width:1320px;margin:auto;padding:54px 42px 30px;display:flex;align-items:flex-end;justify-content:space-between;gap:28px}.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}h1{font-size:clamp(32px,4vw,54px);font-weight:500;letter-spacing:-.06em;line-height:1.04;margin:16px 0}header p{font-size:14px;line-height:1.6;color:var(--muted);max-width:590px;margin:0}button{border:1px solid var(--edge);background:transparent;color:var(--ink);padding:12px 16px;border-radius:30px;cursor:pointer;font:12px Arial;white-space:nowrap}button:hover,button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}button:focus-visible,a:focus-visible{outline:3px solid #9c3e6e;outline-offset:4px}.tools{display:flex;gap:8px;padding-bottom:4px;flex-wrap:wrap}main{max-width:1320px;padding:0 42px 60px;margin:auto}.concept{border-top:1px solid var(--edge);padding:30px 0 40px}.concept-head{display:flex;justify-content:space-between;align-items:flex-start;gap:32px;margin-bottom:20px}.concept-head h2{margin:0;font-size:25px;font-weight:500;letter-spacing:-.035em}.concept-head h2 span{font:11px Arial;color:var(--muted);display:inline-block;vertical-align:middle;margin-right:13px}.concept-head p{font-size:12px;line-height:1.6;max-width:420px;color:var(--muted);margin:1px 0 0}.recommend{color:var(--ink);font-size:10px;letter-spacing:.02em;display:inline-block;background:var(--pink);color:#242126;padding:6px 10px;border-radius:20px;margin-left:12px}.sketches{display:grid;grid-template-columns:minmax(0,1fr) 185px;gap:28px;align-items:start}.frame-label{display:flex;justify-content:space-between;margin:0 0 10px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}svg{display:block;width:100%;height:auto;overflow:hidden;border:1px solid var(--edge);border-radius:3px;background:var(--paper)}svg text{font-family:Arial,Helvetica,sans-serif;fill:var(--ink)}svg .small{font-size:10px;letter-spacing:.7px}svg .tiny{font-size:8px;fill:var(--muted)}svg .label{font-size:12px}svg .mono{font-family:ui-monospace,monospace}svg .paper{fill:var(--paper)}svg .ink{fill:var(--ink)}svg .edge{stroke:var(--edge);fill:none}svg .muted{fill:var(--muted)}svg .pink{fill:var(--pink)}svg .blue{fill:var(--blue)}svg .olive{fill:var(--olive)}svg .yellow{fill:var(--yellow)}svg .fine{fill:none;stroke:var(--ink);stroke-width:1;opacity:.3}svg .field-a{stop-color:var(--field-a)}svg .field-b{stop-color:var(--field-b)}svg .field-c{stop-color:var(--field-c)}svg .footer-sketch{opacity:0;pointer-events:none}body.footer-on .footer-sketch{opacity:1}body.footer-on .underlay{opacity:.35}.notes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:26px;margin-top:18px;font-size:12px;line-height:1.65}.notes b{display:block;font-weight:500;margin-bottom:3px}.notes p{margin:0;color:var(--muted)}.map{border-top:1px solid var(--edge);padding-top:30px}.map h2{font-weight:500;font-size:23px;letter-spacing:-.03em}.content-map{display:grid;grid-template-columns:repeat(5,1fr);gap:22px}.content-map h3{font-size:13px;font-weight:500}.content-map p{font-size:12px;line-height:1.6;color:var(--muted)}.footnote{border-top:1px solid var(--edge);margin-top:28px;padding-top:17px;font-size:11px;line-height:1.7;color:var(--muted)}a{color:inherit} @media(max-width:760px){header{display:block;padding:28px 20px}header .tools{margin-top:22px}main{padding:0 20px 40px}.concept-head{display:block}.concept-head p{margin-top:12px}.sketches{grid-template-columns:minmax(0,1fr) 105px;gap:12px}.notes{grid-template-columns:1fr;gap:10px}.content-map{grid-template-columns:1fr 1fr}.recommend{margin:9px 0 0 27px;display:table}}
</style></head><body><header><div><div class="eyebrow">Cojeev / composition studies / 01</div><h1>Three ways to arrive.</h1><p>Wireframes for one living screen. Same five capabilities, three different ways to discover them. The soft fields below indicate where the real shader belongs.</p></div><div class="tools"><button id="theme" aria-pressed="false">Midnight view</button><button id="footer" aria-pressed="false">Lift the footer ↑</button></div></header><main id="studies"></main>
<script>
const defs=(id)=>`<defs><linearGradient id="${id}-flow" x1="0" y1="1" x2="1" y2="0"><stop class="field-a"/><stop offset=".48" class="field-b"/><stop offset="1" class="field-c"/></linearGradient></defs>`;
const field=(id,w,h)=>`<path d="M 0 ${h*.2} C ${w*.37} ${h*.8},${w*.52} ${-h*.28},${w} ${h*.15} L ${w} ${h} L 0 ${h} Z" fill="url(#${id}-flow)" opacity=".42"/><path d="M 0 ${h*.86} C ${w*.3} ${h*.27},${w*.64} ${h*1.12},${w} ${h*.3}" fill="none" stroke="var(--paper)" stroke-width="${h*.14}" opacity=".56"/>`;
const chromeTop=(w,mobile=false)=>`<text x="22" y="27" class="small">cojeev</text><text x="${w-72}" y="27" class="small">◐　Ⅱ</text>`;
const footer=(w,h,m=false)=>{let y=h*.6;return `<g class="footer-sketch"><path d="M0 ${y+17} Q ${w*.22} ${y-30} ${w*.47} ${y+4} T ${w} ${y+12} L${w} ${h} H0Z" fill="var(--tray)"/><text x="22" y="${y+45}" font-size="${m?15:23}">Many parts. One Cojeev.</text><text x="${w-30}" y="${y+42}" class="label">×</text>${m?['Shared memory','Every harness','Prompt lifecycle','One identity','Smart subagents'].map((x,i)=>`<text x="22" y="${y+66+i*18}" font-size="11">0${i+1}　${x}</text>`).join(''):[['Shared memory','Team context, remembered.'],['Every harness','One operating system.'],['Prompt lifecycle','Before. During. After.'],['One identity','Still you, everywhere.'],['Smart subagents','The right model.']].map((x,i)=>`<text x="${22+i*(w-44)/5}" y="${y+92}" font-size="12">${x[0]}</text><text x="${22+i*(w-44)/5}" y="${y+115}" class="tiny">${x[1]}</text>`).join('')}<text x="22" y="${h-17}" class="tiny">© Cojeev　 /　 More in the making.</text></g>`};
const labels=['Shared memory','Every harness','Prompt lifecycle','One identity','Smart subagents'];
const bottom=(w,h)=>`<path d="M${w*.35} ${h} Q${w*.5} ${h-39} ${w*.65} ${h}" fill="var(--paper)"/><text x="${w/2}" y="${h-16}" text-anchor="middle" class="small">Explore what’s coming ↑</text>`;
function desktop(n){let w=920,h=510,id='d'+n,body='';if(n===1){body=`<text x="460" y="132" text-anchor="middle" class="small">COMING SOON　/　30 : 00 : 00 : 00</text><text x="460" y="283" font-size="184" font-weight="700" letter-spacing="-15" text-anchor="middle">cojeev</text><path d="M244 179 C265 146 311 168 326 211 C340 254 299 287 266 273 C226 256 223 211 244 179Z" class="pink" opacity=".6" transform="translate(92 0)"/><text x="460" y="347" text-anchor="middle" font-size="14">Your AI. In good company.</text>${labels.map((t,i)=>`<text x="${108+i*175}" y="385" text-anchor="middle" class="label">${t}</text>`).join('')}`;}if(n===2){body=`<text x="58" y="139" class="small">COMING SOON</text><text x="58" y="192" font-size="38" letter-spacing="-1.5">One prompt.</text><text x="58" y="234" font-size="38" letter-spacing="-1.5">In good company.</text><path d="M79 306 C89 264 160 270 172 307 C184 344 124 369 93 344 C79 333 74 320 79 306Z" class="pink"/><text x="125" y="323" text-anchor="middle" class="label">you</text>${labels.map((t,i)=>`<path d="M174 316 C${360+i*12} ${316-i*8},${399+i*24} ${128+i*60},595 ${128+i*60}" class="fine"/><circle cx="595" cy="${128+i*60}" r="3" class="ink"/><text x="616" y="${132+i*60}" class="label">${t}</text>`).join('')}<text x="58" y="427" class="mono" font-size="17">30 : 00 : 00 : 00</text>`;}if(n===3){body=`<text x="55" y="123" class="small">TAKING SHAPE</text><text x="48" y="297" font-size="185" letter-spacing="-14">30</text><text x="62" y="331" class="small">DAYS　/　00 HOURS　00 MIN　00 SEC</text><path d="M433 92 C459 190 402 282 453 394" class="fine"/>${labels.map((t,i)=>`<text x="497" y="${126+i*58}" class="tiny">0${i+1}</text><text x="531" y="${128+i*58}" font-size="20" letter-spacing="-.5">${t}</text><path d="M531 ${143+i*58} H840" class="edge"/>`).join('')}<text x="58" y="425" class="label">A little closer. Every day.</text>`;}return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Desktop wireframe ${n}">${defs(id)}${field(id,w,h)}${chromeTop(w)}<g class="underlay">${body}${bottom(w,h)}</g>${footer(w,h)}</svg>`;}
function mobile(n){let w=230,h=440,id='m'+n,b='';if(n===1)b=`<text x="115" y="99" text-anchor="middle" class="tiny">COMING SOON</text><text x="115" y="122" text-anchor="middle" class="mono" font-size="12">30 : 00 : 00 : 00</text><text x="112" y="210" text-anchor="middle" font-size="69" font-weight="700" letter-spacing="-6">cojeev</text><text x="115" y="239" text-anchor="middle" font-size="10">Your AI. In good company.</text>${labels.map((t,i)=>`<text x="${i===4?115:(i%2?169:62)}" y="${290+Math.floor(i/2)*27}" text-anchor="middle" font-size="9">${t}</text>`).join('')}`;if(n===2)b=`<text x="23" y="90" font-size="23" letter-spacing="-1">One prompt.</text><text x="23" y="117" font-size="23" letter-spacing="-1">In good company.</text><circle cx="40" cy="176" r="20" class="pink"/><text x="40" y="180" text-anchor="middle" font-size="10">you</text>${labels.map((t,i)=>`<path d="M40 198 Q40 ${219+i*29} 74 ${219+i*29}" class="fine"/><text x="87" y="${223+i*29}" font-size="10">${t}</text>`).join('')}<text x="23" y="385" class="tiny mono">COMING SOON / 30 : 00 : 00 : 00</text>`;if(n===3)b=`<text x="23" y="77" class="tiny">TAKING SHAPE</text><text x="19" y="174" font-size="107" letter-spacing="-7">30</text><text x="25" y="195" class="tiny">DAYS / 00 H　00 M　00 S</text>${labels.map((t,i)=>`<text x="25" y="${249+i*27}" class="tiny">0${i+1}</text><text x="52" y="${249+i*27}" font-size="12">${t}</text><path d="M52 ${257+i*27} H207" class="edge"/>`).join('')}`;return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Mobile wireframe ${n}">${defs(id)}${field(id,w,h)}${chromeTop(w,true)}<g class="underlay">${b}${bottom(w,h)}</g>${footer(w,h,true)}</svg>`;}
const directions=[{name:'Tidal Type',intro:'The name is the landscape. The shader flows behind oversized type, while a quiet five-part index makes the product immediately legible.',notes:[['First view','Name → coming-soon timer → five visible capability labels. The moving “o” is the one expressive detail.'],['Signature interaction','A label gently changes the nearby colour current. Tap or click opens its full explanation in the curved footer.'],['Quiet / touch','All five labels remain visible. Motion can stop without losing information. On mobile they form a compact 2–2–1 index.']]},{name:'One Prompt / Five Paths',intro:'One small “you” sends a single gesture through five capabilities. A diagram with warmth: the product is the connection, not a row of cards.',notes:[['First view','One short proposition, one origin, five named paths. Countdown is an understated timestamp in the margin.'],['Signature interaction','Selecting a path traces one gentle pulse from “you” to that capability, then raises its footer explanation.'],['Quiet / touch','Paths settle into static ink. Labels stay direct buttons. Mobile turns the branching structure into one readable vertical stem.']]},{name:'The Living Index',intro:'A launch poster with an editorial spine. The large countdown becomes the artefact; five numbered promises sit along a single curved edge.',notes:[['First view','The time remaining is the dominant shape. The complete capability index reads as a compact table of contents.'],['Signature interaction','Choosing an index entry draws its underline along the curve and lifts the same continuous footer surface.'],['Quiet / touch','No hidden carousel. All entries are always visible. On mobile the countdown moves above the index, preserving the same reading order.']]}];
document.getElementById('studies').innerHTML=directions.map((d,i)=>`<section class="concept"><div class="concept-head"><h2><span>0${i+1}</span>${d.name}${i===0?'<small class="recommend">Recommended · builds on Type</small>':''}</h2><p>${d.intro}</p></div><div class="sketches"><div><div class="frame-label"><span>Desktop / first viewport</span><span>One screen</span></div>${desktop(i+1)}</div><div><div class="frame-label">Mobile</div>${mobile(i+1)}</div></div><div class="notes">${d.notes.map(x=>`<div><b>${x[0]}</b><p>${x[1]}</p></div>`).join('')}</div></section>`).join('')+`<section class="map"><div class="eyebrow">Shared content / all three directions</div><h2>Five short names. Five useful explanations.</h2><div class="content-map"><div><h3>01　Shared memory</h3><p>Team context and decisions, remembered across sessions.</p></div><div><h3>02　Every harness</h3><p>One operating system across your coding AI harnesses.</p></div><div><h3>03　Prompt lifecycle</h3><p>Custom hooks and prompt injection. Before, during and after each response.</p></div><div><h3>04　One identity</h3><p>Your identity and preferences, whichever agent you use.</p></div><div><h3>05　Smart subagents</h3><p>Automatic delegation to the right model for each task.</p></div></div><div class="footnote"><b>Before lifting:</b> Cojeev, coming soon, one shared countdown, all five capability labels, theme and motion controls.<br><b>After lifting:</b> the same screen stays fixed. A curved 40vh footer holds the five explanations, a close control and a small copyright line. On short mobile screens, content scrolls inside the footer.<br><b>Timing:</b> the shared 30-day countdown begins at first approved publication. These sketches show an illustrative initial value.<br><b>Scope:</b> composition wireframes only. Gradients here are static placement studies; the actual ShaderGradient backgrounds are being implemented separately. No new landing-page layout has been built from these sketches. <a href="/">Return to the local page ↗</a></div></section>`;
document.getElementById('theme').onclick=function(){const on=document.body.classList.toggle('dark');this.setAttribute('aria-pressed',String(on));this.textContent=on?'Warm paper view':'Midnight view'};document.getElementById('footer').onclick=function(){const on=document.body.classList.toggle('footer-on');this.setAttribute('aria-pressed',String(on));this.textContent=on?'Lower the footer ↓':'Lift the footer ↑'};
</script></body></html>
