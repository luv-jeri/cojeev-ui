<!DOCTYPE html>
<html lang="en" data-mode="light" data-seed="42"><head><meta charset="utf-8"><title>Assistant Panel · demo</title><link rel="stylesheet" href="../../css/vriksha.css">
<style>html,body{margin:0}body{min-height:100vh;padding:32px;box-sizing:border-box;background:var(--v-canvas);display:grid;place-items:center;align-content:center;justify-content:center}body>[data-gate]{max-width:100%}</style></head>
<body>
<section class="entry" id="assistant-panel" data-gate="assistant-panel/demo" style="width:min(100%,1120px)"><h1 class="v-section" style="margin:0 0 6px">Assistant Panel</h1><p class="v-meta" style="margin:0 0 20px">.v-assist[.-mini|.-anchored] > __close (pink, protrudes top-right) + __title + .v-bubble… + .v-btn.-accent · close pulses once on reply (.-pulse)</p><div class="demo"><div style="display:flex;gap:32px;flex-wrap:wrap;align-items:flex-start;padding-top:24px"><div class="v-assist" style="width:340px"><button class="v-assist__close" aria-label="Close"><i class="v-icon " data-icon="x"></i></button><div class="v-assist__title">Ask Cojeev</div><span class="v-bubble">Hey Sanjay — 3 runs finished overnight.</span><span class="v-bubble">Want the summary?</span><button class="v-btn -accent">Show summary</button></div><div class="v-assist -mini"><span class="v-disk -pink -sm"><i class="v-icon " data-icon="message-square"></i></span><span>Ask Cojeev</span><span class="v-badge -count" style="background:var(--v-pink);color:var(--v-text)">2</span></div></div></div></section>
<script src="../../assets/sprites.js"></script><script src="../../catalog/spec.js"></script><script src="../../js/v.js" data-base="../.."></script><script src="../../js/ui.js"></script><script src="../../js/flow.js"></script><script src="../../js/morph.js"></script><script src="../../js/motion.js"></script><script src="../../catalog/demo-behaviour.js"></script><script>(async()=>{await V.init(document.body);if(window.VUI)VUI.init(document.body);if(window.VLive)VLive.init(document.body)})()</script>
<script>document.querySelectorAll('[data-indeterminate]').forEach(i=>i.indeterminate=true);addEventListener('load',()=>document.documentElement.dataset.ready='1');</script>
</body></html>
