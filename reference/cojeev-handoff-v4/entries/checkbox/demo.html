<!DOCTYPE html>
<html lang="en" data-mode="light" data-seed="42"><head><meta charset="utf-8"><title>Checkbox · demo</title><link rel="stylesheet" href="../../css/vriksha.css">

<section class="entry" id="checkbox" data-gate="checkbox/demo" style="width:min(100%,1120px)"><h1 class="v-section" style="margin:0 0 6px">Checkbox</h1><p class="v-meta" style="margin:0 0 20px">label.v-check > input[type=checkbox] · states checked / indeterminate / disabled</p><div class="demo"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:28px;align-items:start"><div style="display:grid;gap:12px"><label class="v-check"><input type="checkbox" checked> Everyday</label><label class="v-check"><input type="checkbox"> Some days</label><label class="v-check"><input type="checkbox" id="ck-ind"> Weekends only</label><label class="v-check"><input type="checkbox" disabled> Not available on this host</label><label class="v-check"><input type="checkbox" disabled checked> Always on (managed)</label></div><div class="v-checks" role="group" aria-label="Notify me when"><label class="v-check -block"><input type="checkbox" checked><span class="v-check__body"><b>A run needs me</b><small>Approvals, confirmations, failed steps.</small></span><span class="v-badge -pink">2 today</span></label><label class="v-check -block"><input type="checkbox"><span class="v-check__body"><b>A run finishes</b><small>One quiet receipt per run.</small></span></label><label class="v-check -block"><input type="checkbox" checked><span class="v-check__body"><b>Weekly digest</b><small>Fridays at 16:00.</small></span><span class="v-badge -yellow">Friday</span></label></div></div></div></section>
