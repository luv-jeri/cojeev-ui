<!DOCTYPE html>
<html lang="en" data-mode="light" data-seed="42"><head><meta charset="utf-8"><title>Toggle Group · demo</title><link rel="stylesheet" href="../../css/vriksha.css">
<style>html,body{margin:0}body{min-height:100vh;padding:32px;box-sizing:border-box;background:var(--v-canvas);display:grid;place-items:center;align-content:center;justify-content:center}body>[data-gate]{max-width:100%}</style></head>
<body>
<section class="entry" id="toggle-group" data-gate="toggle-group/demo" style="width:min(100%,1120px)"><h1 class="v-section" style="margin:0 0 6px">Toggle Group</h1><p class="v-meta" style="margin:0 0 20px">[data-togglegroup="single|multi"] > .v-toggle|.v-btn[aria-pressed] · weekday picker: .v-weekdays (checkboxes)</p><div class="demo"><div style="display:grid;grid-template-columns:minmax(0,1fr);gap:16px"><div class="v-seg" data-togglegroup="single"><button class="v-btn -sm" aria-pressed="false">Today</button><button class="v-btn -sm" aria-pressed="true">Week</button><button class="v-btn -sm" aria-pressed="false">Month</button></div><div style="display:flex;gap:8px" data-togglegroup="multi"><button class="v-toggle -pink -circle" aria-pressed="true">MO</button><button class="v-toggle -pink -circle" aria-pressed="true">TU</button><button class="v-toggle -pink -circle" aria-pressed="true">WE</button><button class="v-toggle -pink -circle" aria-pressed="true">TH</button><button class="v-toggle -pink -circle" aria-pressed="true">FR</button><button class="v-toggle -pink -circle" aria-pressed="false">SA</button><button class="v-toggle -pink -circle" aria-pressed="false">SU</button></div></div></div></section>
