<!DOCTYPE html>
<html lang="en" data-mode="light" data-seed="42"><head><meta charset="utf-8"><title>Field · demo</title><link rel="stylesheet" href="../../css/vriksha.css">
<style>html,body{margin:0}body{min-height:100vh;padding:32px;box-sizing:border-box;background:var(--v-canvas);display:grid;place-items:center;align-content:center;justify-content:center}body>[data-gate]{max-width:100%}</style></head>
<body>
<section class="entry" id="field" data-gate="field/demo" style="width:min(100%,1120px)"><h1 class="v-section" style="margin:0 0 6px">Field</h1><p class="v-meta" style="margin:0 0 20px">.v-field[.-invalid] > .v-label + control + .v-help (reserved line, becomes the error) · aria-describedby / aria-invalid</p><div class="demo"><div style="display:grid;gap:20px;max-width:420px"><div class="v-field"><label class="v-label" for="f1">Water today</label><input class="v-input" id="f1" placeholder="6 of 15 glasses" aria-describedby="f1h"><div class="v-help" id="f1h">Counts reset at midnight in your timezone.</div></div><div class="v-field -invalid"><label class="v-label -sm" for="f2">Schedule</label><input class="v-input" id="f2" value="every 90 mins" aria-invalid="true" aria-describedby="f2h"><div class="v-help" id="f2h">Use a time like 16:00 or a weekday.</div></div></div></div></section>
<script src="../../assets/sprites.js"></script><script src="../../catalog/spec.js"></script><script src="../../js/v.js" data-base="../.."></script><script src="../../js/ui.js"></script><script src="../../js/flow.js"></script><script src="../../js/morph.js"></script><script src="../../js/motion.js"></script><script src="../../catalog/demo-behaviour.js"></script><script>(async()=>{await V.init(document.body);if(window.VUI)VUI.init(document.body);if(window.VLive)VLive.init(document.body)})()</script>
<script>document.querySelectorAll('[data-indeterminate]').forEach(i=>i.indeterminate=true);addEventListener('load',()=>document.documentElement.dataset.ready='1');</script>
</body></html>
