<!DOCTYPE html>
<html lang="en" data-mode="light" data-seed="42"><head><meta charset="utf-8"><title>Input Group · demo</title><link rel="stylesheet" href="../../css/vriksha.css">
<style>html,body{margin:0}body{min-height:100vh;padding:32px;box-sizing:border-box;background:var(--v-canvas);display:grid;place-items:center;align-content:center;justify-content:center}body>[data-gate]{max-width:100%}</style></head>
<body>
<section class="entry" id="input-group" data-gate="input-group/demo" style="width:min(100%,1120px)"><h1 class="v-section" style="margin:0 0 6px">Input Group</h1><p class="v-meta" style="margin:0 0 20px">.v-igroup > .v-addon + input + .v-btn|.v-badge · topbar variant: .v-search (pink disk + cream field + scope chips)</p><div class="demo"><div style="display:grid;gap:16px;max-width:600px"><div class="v-igroup"><i class="v-icon " data-icon="search"></i><span class="v-addon">In:</span><input placeholder="Search runs…" aria-label="Search runs"><span class="v-badge -ink">Work</span><span class="v-badge">Memory</span><button class="v-btn -sm" style="flex:none">Search</button></div><div class="v-igroup"><span class="v-addon">https://</span><input value="intelly.app/agents/cedar" aria-label="URL"><hr class="v-sep -v"><button class="v-ibtn -sm" aria-label="Copy"><i class="v-icon " data-icon="copy"></i></button><button class="v-ibtn -sm -ink" aria-label="Open"><i class="v-icon " data-icon="arrow-ur"></i></button></div><div class="v-igroup"><i class="v-icon " data-icon="at-sign"></i><input placeholder="Invite by email" aria-label="Invite by email"><button class="v-btn -sm -accent" style="flex:none">Invite <i class="v-icon " data-icon="send"></i></button></div><div class="v-search"><span class="v-search__disk"><i class="v-icon " data-icon="search"></i></span><label class="v-input" style="flex:1"><input placeholder="Search" aria-label="Search"><span class="v-scope">In: <span class="v-badge -ink">Work</span><span class="v-badge -dashed">Memory</span><span class="v-badge -dashed">Library</span></span></label></div></div></div></section>
<script src="../../assets/sprites.js"></script><script src="../../catalog/spec.js"></script><script src="../../js/v.js" data-base="../.."></script><script src="../../js/ui.js"></script><script src="../../js/flow.js"></script><script src="../../js/morph.js"></script><script src="../../js/motion.js"></script><script src="../../catalog/demo-behaviour.js"></script><script>(async()=>{await V.init(document.body);if(window.VUI)VUI.init(document.body);if(window.VLive)VLive.init(document.body)})()</script>
<script>document.querySelectorAll('[data-indeterminate]').forEach(i=>i.indeterminate=true);addEventListener('load',()=>document.documentElement.dataset.ready='1');</script>
</body></html>
