<!DOCTYPE html>
<html lang="en" data-mode="light" data-seed="42"><head><meta charset="utf-8"><title>Toast · demo</title><link rel="stylesheet" href="../../css/vriksha.css">
<style>html,body{margin:0}body{min-height:100vh;padding:32px;box-sizing:border-box;background:var(--v-canvas);display:grid;place-items:center;align-content:center;justify-content:center}body>[data-gate]{max-width:100%}</style></head>
<body>
<section class="entry" id="toast" data-gate="toast/demo" style="width:min(100%,1120px)"><h1 class="v-section" style="margin:0 0 6px">Toast</h1><p class="v-meta" style="margin:0 0 20px">VUI.toast({text,kind:"-cream|-danger",action,durable}) or [data-toast][data-kind][data-durable][data-action] · durable toasts stay until dismissed (receipts)</p><div class="demo"><div style="display:flex;gap:12px;flex-wrap:wrap"><button class="v-btn -secondary" data-toast="Run started · receipt #3586895">Ink toast</button><button class="v-btn -secondary" data-toast="Saved to Memory" data-kind="-cream" data-action="Open">Cream with action</button><button class="v-btn -secondary" data-toast="Run failed · host closed the session" data-kind="-danger" data-durable>Durable danger</button></div></div></section>
<script src="../../assets/sprites.js"></script><script src="../../catalog/spec.js"></script><script src="../../js/v.js" data-base="../.."></script><script src="../../js/ui.js"></script><script src="../../js/flow.js"></script><script src="../../js/morph.js"></script><script src="../../js/motion.js"></script><script src="../../catalog/demo-behaviour.js"></script><script>(async()=>{await V.init(document.body);if(window.VUI)VUI.init(document.body);if(window.VLive)VLive.init(document.body)})()</script>
<script>document.querySelectorAll('[data-indeterminate]').forEach(i=>i.indeterminate=true);addEventListener('load',()=>document.documentElement.dataset.ready='1');</script>
</body></html>
