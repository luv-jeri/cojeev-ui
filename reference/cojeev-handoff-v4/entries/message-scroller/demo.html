<!DOCTYPE html>
<html lang="en" data-mode="light" data-seed="42"><head><meta charset="utf-8"><title>Message Scroller · demo</title><link rel="stylesheet" href="../../css/vriksha.css">
<style>html,body{margin:0}body{min-height:100vh;padding:32px;box-sizing:border-box;background:var(--v-canvas);display:grid;place-items:center;align-content:center;justify-content:center}body>[data-gate]{max-width:100%}</style></head>
<body>
<section class="entry" id="message-scroller" data-gate="message-scroller/demo" style="width:min(100%,1120px)"><h1 class="v-section" style="margin:0 0 6px">Message Scroller</h1><p class="v-meta" style="margin:0 0 20px">.v-scroller[data-scroller] · follows new messages only while at the bottom; __jump appears when detached</p><div class="demo"><div class="v-scroller" data-scroller id="ms1" style="--h:220px"><span class="v-bubble" style="background:var(--v-canvas)">Message 1</span><span class="v-bubble" style="background:var(--v-canvas)">Message 2</span><span class="v-bubble" style="background:var(--v-canvas)">Message 3</span><span class="v-bubble" style="background:var(--v-canvas)">Message 4</span><span class="v-bubble" style="background:var(--v-canvas)">Message 5</span><span class="v-bubble" style="background:var(--v-canvas)">Message 6</span><span class="v-bubble" style="background:var(--v-canvas)">Message 7</span><span class="v-bubble" style="background:var(--v-canvas)">Message 8</span><span class="v-bubble" style="background:var(--v-canvas)">Message 9</span><button class="v-btn -sm v-scroller__jump">Jump to latest</button></div><button class="v-btn -sm -secondary" style="margin-top:8px" onclick="const s=document.getElementById('ms1');const b=document.createElement('span');b.className='v-bubble';b.style.background='var(--v-canvas)';b.textContent='New message '+(s.children.length);s.insertBefore(b,s.lastElementChild)">Add a message</button></div></section>
<script src="../../assets/sprites.js"></script><script src="../../catalog/spec.js"></script><script src="../../js/v.js" data-base="../.."></script><script src="../../js/ui.js"></script><script src="../../js/flow.js"></script><script src="../../js/morph.js"></script><script src="../../js/motion.js"></script><script src="../../catalog/demo-behaviour.js"></script><script>(async()=>{await V.init(document.body);if(window.VUI)VUI.init(document.body);if(window.VLive)VLive.init(document.body)})()</script>
<script>document.querySelectorAll('[data-indeterminate]').forEach(i=>i.indeterminate=true);addEventListener('load',()=>document.documentElement.dataset.ready='1');</script>
</body></html>
