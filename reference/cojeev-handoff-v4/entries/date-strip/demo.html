<!DOCTYPE html>
<html lang="en" data-mode="light" data-seed="42"><head><meta charset="utf-8"><title>Date Strip + Weekday Picker · demo</title><link rel="stylesheet" href="../../css/vriksha.css">
<style>html,body{margin:0}body{min-height:100vh;padding:32px;box-sizing:border-box;background:var(--v-canvas);display:grid;place-items:center;align-content:center;justify-content:center}body>[data-gate]{max-width:100%}</style></head>
<body>
<section class="entry" id="date-strip" data-gate="date-strip/demo" style="width:min(100%,1120px)"><h1 class="v-section" style="margin:0 0 6px">Date Strip + Weekday Picker</h1><p class="v-meta" style="margin:0 0 20px">.v-datestrip > button[aria-pressed][data-mark][disabled] (b = day number) · .v-weekdays (7 pink circles, checkboxes)</p><div class="demo"><div style="display:grid;gap:24px;max-width:420px"><div class="v-datestrip"><button   data-mark>MO<b>11</b></button><button   data-mark>TU<b>12</b></button><button  disabled >WE<b>13</b></button><button   data-mark>TH<b>14</b></button><button   >FR<b>15</b></button><button   data-mark>SA<b>16</b></button><button aria-pressed="true"  >SU<b>17</b></button><button   >MO<b>18</b></button></div><div class="v-weekdays"><label><input type="checkbox" checked>MO</label><label><input type="checkbox" checked>TU</label><label><input type="checkbox" checked>WE</label><label><input type="checkbox" checked>TH</label><label><input type="checkbox" checked>FR</label><label><input type="checkbox" >SA</label><label><input type="checkbox" >SU</label></div></div></div></section>
<script src="../../assets/sprites.js"></script><script src="../../catalog/spec.js"></script><script src="../../js/v.js" data-base="../.."></script><script src="../../js/ui.js"></script><script src="../../js/flow.js"></script><script src="../../js/morph.js"></script><script src="../../js/motion.js"></script><script src="../../catalog/demo-behaviour.js"></script><script>(async()=>{await V.init(document.body);if(window.VUI)VUI.init(document.body);if(window.VLive)VLive.init(document.body)})()</script>
<script>document.querySelectorAll('[data-indeterminate]').forEach(i=>i.indeterminate=true);addEventListener('load',()=>document.documentElement.dataset.ready='1');</script>
</body></html>
