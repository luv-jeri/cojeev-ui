<!DOCTYPE html>
<html lang="en" data-mode="light" data-seed="42"><head><meta charset="utf-8"><title>Slider · demo</title><link rel="stylesheet" href="../../css/vriksha.css">
<style>html,body{margin:0}body{min-height:100vh;padding:32px;box-sizing:border-box;background:var(--v-canvas);display:grid;place-items:center;align-content:center;justify-content:center}body>[data-gate]{max-width:100%}</style></head>
<body>
<section class="entry" id="slider" data-gate="slider/demo" style="width:min(100%,1120px)"><h1 class="v-section" style="margin:0 0 6px">Slider</h1><p class="v-meta" style="margin:0 0 20px">input.v-slider[.-pink][data-slider-out="#out"][data-unit] · beige track, ink thumb, pink fill</p><div class="demo"><div style="display:grid;gap:24px;max-width:380px"><div class="v-sliderwrap"><div class="v-sliderwrap__row"><span>Effort</span><output id="sl1o"></output></div><input class="v-slider -pink" type="range" min="0" max="100" value="40" data-slider-out="#sl1o" data-unit=" %" aria-label="Effort"></div><div class="v-sliderwrap"><div class="v-sliderwrap__row"><span>Runs per day</span><output id="sl2o"></output></div><input class="v-slider" type="range" min="1" max="12" value="4" data-slider-out="#sl2o" aria-label="Runs per day"></div></div></div></section>
<script src="../../assets/sprites.js"></script><script src="../../catalog/spec.js"></script><script src="../../js/v.js" data-base="../.."></script><script src="../../js/ui.js"></script><script src="../../js/flow.js"></script><script src="../../js/morph.js"></script><script src="../../js/motion.js"></script><script src="../../catalog/demo-behaviour.js"></script><script>(async()=>{await V.init(document.body);if(window.VUI)VUI.init(document.body);if(window.VLive)VLive.init(document.body)})()</script>
<script>document.querySelectorAll('[data-indeterminate]').forEach(i=>i.indeterminate=true);addEventListener('load',()=>document.documentElement.dataset.ready='1');</script>
</body></html>
