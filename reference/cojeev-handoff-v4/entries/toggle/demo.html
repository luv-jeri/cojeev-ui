<!DOCTYPE html>
<html lang="en" data-mode="light" data-seed="42"><head><meta charset="utf-8"><title>Toggle · demo</title><link rel="stylesheet" href="../../css/vriksha.css">
<style>html,body{margin:0}body{min-height:100vh;padding:32px;box-sizing:border-box;background:var(--v-canvas);display:grid;place-items:center;align-content:center;justify-content:center}body>[data-gate]{max-width:100%}</style></head>
<body>
<section class="entry" id="toggle" data-gate="toggle/demo" style="width:min(100%,1120px)"><h1 class="v-section" style="margin:0 0 6px">Toggle</h1><p class="v-meta" style="margin:0 0 20px">.v-toggle[data-toggle][aria-pressed][.-pink|.-circle]</p><div class="demo"><div style="display:grid;gap:18px"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="v-toggle" data-toggle aria-pressed="true"><i class="v-icon " data-icon="bell"></i>Notify</button><button class="v-toggle" data-toggle aria-pressed="false"><i class="v-icon " data-icon="eye"></i>Watch</button><button class="v-toggle -pink" data-toggle aria-pressed="true"><i class="v-icon " data-icon="heart"></i>Favourite</button><button class="v-toggle -olive" data-toggle aria-pressed="true"><i class="v-icon " data-icon="brain"></i>Remember</button><button class="v-toggle -blue" data-toggle aria-pressed="false"><i class="v-icon " data-icon="monitor"></i>Show on Work</button><button class="v-toggle" data-toggle aria-pressed="false" disabled>Unavailable</button></div><div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center"><div class="v-togglewell" role="group" aria-label="Weekdays"><button class="v-toggle -pink -circle" data-toggle aria-pressed="true" aria-label="Monday">M</button><button class="v-toggle -pink -circle" data-toggle aria-pressed="true" aria-label="Tuesday">T</button><button class="v-toggle -pink -circle" data-toggle aria-pressed="false" aria-label="Wednesday">W</button><button class="v-toggle -pink -circle" data-toggle aria-pressed="true" aria-label="Thursday">T</button><button class="v-toggle -pink -circle" data-toggle aria-pressed="false" aria-label="Friday">F</button></div><div class="v-togglewell" role="group" aria-label="Text style"><button class="v-toggle -circle" data-toggle aria-pressed="true" aria-label="Bold"><b>B</b></button><button class="v-toggle -circle" data-toggle aria-pressed="false" aria-label="Italic"><i>I</i></button><button class="v-toggle -circle" data-toggle aria-pressed="false" aria-label="Underline"><u>U</u></button></div></div></div></div></section>
<script src="../../assets/sprites.js"></script><script src="../../catalog/spec.js"></script><script src="../../js/v.js" data-base="../.."></script><script src="../../js/ui.js"></script><script src="../../js/flow.js"></script><script src="../../js/morph.js"></script><script src="../../js/motion.js"></script><script src="../../catalog/demo-behaviour.js"></script><script>(async()=>{await V.init(document.body);if(window.VUI)VUI.init(document.body);if(window.VLive)VLive.init(document.body)})()</script>
<script>document.querySelectorAll('[data-indeterminate]').forEach(i=>i.indeterminate=true);addEventListener('load',()=>document.documentElement.dataset.ready='1');</script>
</body></html>
