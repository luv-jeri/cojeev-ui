<!DOCTYPE html>
<html lang="en" data-mode="light" data-seed="42"><head><meta charset="utf-8"><title>Textarea · demo</title><link rel="stylesheet" href="../../css/vriksha.css">
<style>html,body{margin:0}body{min-height:100vh;padding:32px;box-sizing:border-box;background:var(--v-canvas);display:grid;place-items:center;align-content:center;justify-content:center}body>[data-gate]{max-width:100%}</style></head>
<body>
<section class="entry" id="textarea" data-gate="textarea/demo" style="width:min(100%,1120px)"><h1 class="v-section" style="margin:0 0 6px">Textarea</h1><p class="v-meta" style="margin:0 0 20px">textarea.v-textarea · beige r16, pink focus · composer pattern adds a send .v-ibtn</p><div class="demo"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:24px;align-items:start"><div class="v-composer"><textarea class="v-textarea" placeholder="Ask Cojeev anything…" aria-label="Message" rows="3"></textarea><div class="v-composer__bar"><button class="v-ibtn" aria-label="Attach a file"><i class="v-icon " data-icon="plus"></i></button><button class="v-ibtn" aria-label="Mention an agent"><i class="v-icon " data-icon="at-sign"></i></button><span class="v-meta">Shift + Enter for a new line</span><button class="v-ibtn -pink" aria-label="Send"><i class="v-icon " data-icon="send"></i></button></div></div><div class="v-field"><label class="v-label -sm" for="ta-notes">Notes for the run</label><textarea class="v-textarea" id="ta-notes" aria-describedby="ta-h" placeholder="What should Cedar keep in mind?"></textarea><div class="v-help" id="ta-h">Saved with the run record. Plain text only.</div></div></div></div></section>
<script src="../../assets/sprites.js"></script><script src="../../catalog/spec.js"></script><script src="../../js/v.js" data-base="../.."></script><script src="../../js/ui.js"></script><script src="../../js/flow.js"></script><script src="../../js/morph.js"></script><script src="../../js/motion.js"></script><script src="../../catalog/demo-behaviour.js"></script><script>(async()=>{await V.init(document.body);if(window.VUI)VUI.init(document.body);if(window.VLive)VLive.init(document.body)})()</script>
<script>document.querySelectorAll('[data-indeterminate]').forEach(i=>i.indeterminate=true);addEventListener('load',()=>document.documentElement.dataset.ready='1');</script>
</body></html>
