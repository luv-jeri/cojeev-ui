<!DOCTYPE html>
<html lang="en" data-mode="light" data-seed="42"><head><meta charset="utf-8"><title>Item · demo</title><link rel="stylesheet" href="../../css/vriksha.css">
<style>html,body{margin:0}body{min-height:100vh;padding:32px;box-sizing:border-box;background:var(--v-canvas);display:grid;place-items:center;align-content:center;justify-content:center}body>[data-gate]{max-width:100%}</style></head>
<body>
<section class="entry" id="item" data-gate="item/demo" style="width:min(100%,1120px)"><h1 class="v-section" style="margin:0 0 6px">Item</h1><p class="v-meta" style="margin:0 0 20px">.v-item[.-selected|.-flat] > .v-disk + __body(__title, __sub) + trailing .v-time|.v-badge|chevron · .v-list[.-grouped]</p><div class="demo"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:24px"><div class="v-list"><button class="v-item -selected"><span class="v-disk"><i class="v-icon " data-icon="git-branch"></i></span><span class="v-item__body"><span class="v-item__title">Cedar · release notes</span><span class="v-item__sub">Approve push to main</span></span><span class="v-time">09 : 15</span></button><button class="v-item"><span class="v-disk -blue"><i class="v-icon " data-icon="monitor"></i></span><span class="v-item__body"><span class="v-item__title">Willow · invoice check</span><span class="v-item__sub">Confirm the total</span></span><span class="v-time -blue">09 : 40</span></button></div><div class="v-list -grouped"><button class="v-item"><span class="v-disk -yellow"><i class="v-icon " data-icon="repeat"></i></span><span class="v-item__body"><span class="v-item__title">Automations</span></span><span class="v-badge -count">2</span><i class="v-icon " data-icon="chevron-right"></i></button><button class="v-item"><span class="v-disk -olive"><i class="v-icon " data-icon="brain"></i></span><span class="v-item__body"><span class="v-item__title">Memory</span></span><span class="v-badge -count">24</span><i class="v-icon " data-icon="chevron-right"></i></button><button class="v-item"><span class="v-disk -pink"><i class="v-icon " data-icon="sparkles"></i></span><span class="v-item__body"><span class="v-item__title">Library</span></span><span class="v-badge -count">3</span><i class="v-icon " data-icon="chevron-right"></i></button></div></div></div></section>
<script src="../../assets/sprites.js"></script><script src="../../catalog/spec.js"></script><script src="../../js/v.js" data-base="../.."></script><script src="../../js/ui.js"></script><script src="../../js/flow.js"></script><script src="../../js/morph.js"></script><script src="../../js/motion.js"></script><script src="../../catalog/demo-behaviour.js"></script><script>(async()=>{await V.init(document.body);if(window.VUI)VUI.init(document.body);if(window.VLive)VLive.init(document.body)})()</script>
<script>document.querySelectorAll('[data-indeterminate]').forEach(i=>i.indeterminate=true);addEventListener('load',()=>document.documentElement.dataset.ready='1');</script>
</body></html>
