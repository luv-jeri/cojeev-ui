<!DOCTYPE html>
<html lang="en" data-mode="light" data-seed="42"><head><meta charset="utf-8"><title>Badge · demo</title><link rel="stylesheet" href="../../css/vriksha.css">

<section class="entry" id="badge" data-gate="badge/demo" style="width:min(100%,1120px)"><h1 class="v-section" style="margin:0 0 6px">Badge</h1><p class="v-meta" style="margin:0 0 20px">.v-badge.-pink|-yellow|-olive|-blue|-ink|-cream|-*-soft|-danger|-pending|-count|-dashed|-caps|-test|-live[.-sm|-lg]</p><div class="demo"><div style="display:grid;gap:14px"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="v-badge -pink">Fever</span><span class="v-badge -blue">Requested</span><span class="v-badge -olive">Sent</span><span class="v-badge -yellow">Scheduled</span><span class="v-badge -danger">Attention</span><span class="v-badge -ink">Patients</span><span class="v-badge">Default</span></div><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="v-badge -pink-soft">git push</span><span class="v-badge -blue-soft">Work</span><span class="v-badge -olive-soft">Memory</span><span class="v-badge -yellow-soft">Automations</span><span class="v-badge -dashed">Education</span><span class="v-badge -test">TEST ONLY · No outside changes</span></div><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="v-badge -pending"><span class="v-dot"></span>In progress 02:15</span><span class="v-badge -live"><span class="v-dot"></span>Observed 09:12</span><span class="v-badge -ink -caps">Patients</span><span class="v-badge -count">24</span><span class="v-badge -sm -pink">sm</span><span class="v-badge -lg -pink-soft">Large</span></div></div></div></section>
