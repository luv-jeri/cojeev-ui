<!DOCTYPE html>
<html lang="en" data-mode="light" data-seed="42"><head><meta charset="utf-8"><title>Radio Group · demo</title><link rel="stylesheet" href="../../css/vriksha.css">
<style>html,body{margin:0}body{min-height:100vh;padding:32px;box-sizing:border-box;background:var(--v-canvas);display:grid;place-items:center;align-content:center;justify-content:center}body>[data-gate]{max-width:100%}</style></head>
<body>
<section class="entry" id="radio-group" data-gate="radio-group/demo" style="width:min(100%,1120px)"><h1 class="v-section" style="margin:0 0 6px">Radio Group</h1><p class="v-meta" style="margin:0 0 20px">label.v-radio > input[type=radio] · pictographic: label.v-iradio (icon + caption, pink pill when checked)</p><div class="demo"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:28px;align-items:start"><div class="v-radios" role="radiogroup" aria-label="When to ask"><label class="v-radio -block"><input type="radio" name="r1" checked><span class="v-radio__body"><b>Ask before every outside change</b><small>Safest. Every push, send or delete waits for you.</small></span></label><label class="v-radio -block"><input type="radio" name="r1"><span class="v-radio__body"><b>Ask only for git push</b><small>Local edits run freely; pushes wait.</small></span></label><label class="v-radio -block"><input type="radio" name="r1"><span class="v-radio__body"><b>Never ask</b><small>Test projects only.</small></span><span class="v-badge -test">TEST ONLY</span></label></div><div style="display:grid;gap:18px"><div class="v-iradios"><label class="v-iradio"><input type="radio" name="r2"><i class="v-icon " data-icon="sun"></i><small>Morning</small></label><label class="v-iradio"><input type="radio" name="r2" checked><i class="v-icon " data-icon="coffee"></i><small>Noon</small></label><label class="v-iradio"><input type="radio" name="r2"><i class="v-icon " data-icon="moon"></i><small>Night</small></label></div><div style="display:grid;gap:10px"><label class="v-radio"><input type="radio" name="r3" checked>Inline radio</label><label class="v-radio"><input type="radio" name="r3">Another choice</label><label class="v-radio"><input type="radio" name="r3" disabled>Not on this host</label></div></div></div></div></section>
<script src="../../assets/sprites.js"></script><script src="../../catalog/spec.js"></script><script src="../../js/v.js" data-base="../.."></script><script src="../../js/ui.js"></script><script src="../../js/flow.js"></script><script src="../../js/morph.js"></script><script src="../../js/motion.js"></script><script src="../../catalog/demo-behaviour.js"></script><script>(async()=>{await V.init(document.body);if(window.VUI)VUI.init(document.body);if(window.VLive)VLive.init(document.body)})()</script>
<script>document.querySelectorAll('[data-indeterminate]').forEach(i=>i.indeterminate=true);addEventListener('load',()=>document.documentElement.dataset.ready='1');</script>
</body></html>
