<!DOCTYPE html>
<html lang="en" data-mode="dark" data-seed="42"><head><meta charset="utf-8"><title>empty/default/default/rest (dark)</title><link rel="stylesheet" href="../../css/vriksha.css">
<style>html,body{margin:0}body{width:960px;height:360px;overflow:hidden;padding:24px;box-sizing:border-box;background:var(--v-canvas);display:grid;place-items:center;align-content:center;justify-content:center}body>[data-gate]{max-width:100%}</style></head>
<body>
<div data-gate="empty/default/default/rest" data-canvas="960x360"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px"><div class="v-card v-empty" data-gate="card/default/default/rest"><i class="v-shape -crescent" style="--c:var(--v-yellow)"></i><div class="v-empty__title">Ooops!</div><div class="v-empty__text">Connection to Claude Code failed. Nothing was changed.</div><button class="v-btn" data-gate="button/default/default/rest">Retry <i class="v-icon " data-icon="refresh-cw"></i></button></div><div class="v-card v-empty" data-gate="card/default/default/rest"><i class="v-shape -star-4" style="--c:var(--v-pink)"></i><div class="v-empty__title">Nothing needs you</div><div class="v-empty__text">All 14 agents are working. Checked 2 min ago.</div></div><div class="v-state -filtered" data-gate="data-state/filtered/default/rest"><div class="v-state__word">No runs match "failed" this week</div><div class="v-state__why">There were 41 runs; none failed.</div><button class="v-btn -sm -secondary" data-gate="button/secondary/sm/rest">Clear filter</button></div></div></div>
<script src="../../assets/sprites.js"></script><script src="../../catalog/spec.js"></script><script src="../../js/v.js" data-base="../.."></script><script src="../../js/ui.js"></script><script src="../../js/flow.js"></script><script src="../../js/morph.js"></script><script src="../../js/motion.js"></script>
<script>document.querySelectorAll('[data-indeterminate]').forEach(i=>i.indeterminate=true);addEventListener('load',()=>document.documentElement.dataset.ready='1');</script>
</body></html>
