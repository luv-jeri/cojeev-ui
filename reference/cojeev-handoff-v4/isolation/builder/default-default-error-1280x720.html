<!DOCTYPE html>
<html lang="en" data-mode="light" data-seed="42"><head><meta charset="utf-8"><title>builder/default/default/error</title><link rel="stylesheet" href="../../css/vriksha.css">
<style>html,body{margin:0}body{width:1280px;height:720px;overflow:hidden;padding:24px;box-sizing:border-box;background:var(--v-canvas);display:grid;place-items:center;align-content:center;justify-content:center}body>[data-gate]{max-width:100%}</style></head>
<body>
<div data-gate="builder/default/default/error" data-canvas="1280x720"><div data-demo="builder" style="display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) minmax(0,220px);gap:16px">
<div class="v-palette" data-gate="builder/v-palette/default/rest"><div class="v-caps" data-gate="builder/v-caps/default/rest">Steps</div><button class="v-palette__item" data-add="Read files"><span class="v-disk -sm -blue" data-gate="builder/v-disk/sm/rest"><i class="v-icon " data-icon="file-text"></i></span>Read files</button><button class="v-palette__item" data-add="Ask AI"><span class="v-disk -sm -pink" data-gate="builder/v-disk/sm/rest"><i class="v-icon " data-icon="sparkles"></i></span>Ask AI</button><button class="v-palette__item" data-add="Save to Memory"><span class="v-disk -sm -olive" data-gate="builder/v-disk/sm/rest"><i class="v-icon " data-icon="brain"></i></span>Save to Memory</button><p class="v-meta" data-gate="builder/v-meta/default/rest">Enter adds a step to the outline below. Drag-and-drop is not implemented in this demo.</p></div>
<div style="display:grid;grid-template-columns:minmax(0,1fr);gap:10px"><div class="v-validation" data-validation="" role="status" aria-live="polite" data-gate="builder/v-validation/default/rest"><i class="v-icon " data-icon="alert-circle"></i><span data-vtext="">1 field needs a value — “Draft notes” has no template</span></div>
<div style="position:relative;min-height:180px;background:var(--v-canvas);border:1px dashed var(--v-border);border-radius:20px;overflow:hidden"><svg style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none" aria-hidden="true"><path class="v-wire" d="M150 78 C 200 78 200 112 250 112"></path></svg>
<button class="v-node" data-node="read" style="position:absolute;left:12px;top:56px;text-align:left" data-gate="builder/default/default/rest"><div class="v-node__head"><span class="v-disk -sm -blue" data-gate="builder/v-disk/sm/rest"><i class="v-icon " data-icon="file-text"></i></span>Read files</div><div class="v-node__sub">3 paths · project Cedar</div><span class="v-node__port -out"></span></button>
<button class="v-node -ai -invalid" data-node="draft" aria-invalid="true" style="position:absolute;left:250px;top:90px;text-align:left" data-gate="builder/ai+invalid/default/error"><span class="v-node__port -in"></span><div class="v-node__head"><span class="v-disk -sm -pink" data-gate="builder/v-disk/sm/rest"><i class="v-icon " data-icon="sparkles"></i></span>Draft notes</div><div class="v-node__sub" data-nodesub="" style="color:var(--v-danger-ink)">Template missing</div></button></div>
<ol data-outline="" class="v-meta" style="margin:0;padding-left:1.2em;display:grid;gap:2px" data-gate="builder/v-meta/default/rest"><li>Read files</li><li>Draft notes</li></ol></div>
<div class="v-inspector" data-inspector="" data-gate="builder/v-inspector/default/rest"><div class="v-inspector__title" data-ititle="">Draft notes</div><div class="v-field -invalid" data-tfield="" data-gate="field/invalid/default/error"><label class="v-label -sm" for="bt" data-gate="label/default/sm/rest">Template</label><textarea class="v-textarea" id="bt" data-template="" style="min-height:64px" aria-invalid="true" aria-describedby="bth" placeholder="List breaking changes first, then fixes." data-gate="textarea/default/default/error"></textarea><div class="v-help" id="bth" data-gate="builder/v-help/default/rest">Required. Describe what the notes should contain.</div></div><div class="v-field" data-gate="field/default/default/rest"><label class="v-label -sm" for="bm" data-gate="label/default/sm/rest">Model</label><select class="v-native" id="bm" data-gate="native-select/default/default/rest"><option>Claude Sonnet 4.5</option><option>Claude Opus 4.1</option></select></div></div></div></div>
<script src="../../assets/sprites.js"></script><script src="../../catalog/spec.js"></script><script src="../../js/v.js" data-base="../.."></script><script src="../../js/ui.js"></script><script src="../../js/flow.js"></script><script src="../../js/morph.js"></script><script src="../../js/motion.js"></script>
<script>document.querySelectorAll('[data-indeterminate]').forEach(i=>i.indeterminate=true);addEventListener('load',()=>document.documentElement.dataset.ready='1');</script>
</body></html>
