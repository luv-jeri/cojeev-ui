<!DOCTYPE html>
<html lang="en" data-mode="light" data-seed="42"><head><meta charset="utf-8"><title>chat-dock/default/default/rest</title><link rel="stylesheet" href="../../css/vriksha.css">
<style>html,body{margin:0}body{width:720px;height:600px;overflow:hidden;padding:24px;box-sizing:border-box;background:var(--v-canvas);display:grid;place-items:center;align-content:center;justify-content:center}body>[data-gate]{max-width:100%}</style></head>
<body>
<div data-gate="chat-dock/default/default/rest" data-canvas="720x600"><div data-demo="chat" class="v-assist" style="width:min(380px,100%)" data-gate="assistant-panel/default/default/rest"><button class="v-assist__close" aria-label="Close Ask Cojeev"><i class="v-icon " data-icon="x"></i></button><div class="v-assist__title">Ask Cojeev</div><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="v-badge -cream" data-gate="badge/cream/default/rest">Project Cedar</span><span class="v-badge -cream" data-gate="badge/cream/default/rest">Run #3586895</span></div>
<div class="v-scroller" data-scroller="" data-thread="" style="--h:210px;background:transparent;padding:0;gap:10px" data-gate="message-scroller/default/default/rest"><span class="v-bubble -me" style="align-self:end" data-gate="chat-dock/v-bubble/default/rest">Summarise last night's runs.</span>
<div class="v-card -cream -sm" style="display:grid;gap:8px" data-gate="card/cream/sm/rest"><div style="display:flex;gap:8px;align-items:center"><span class="v-badge -olive" data-gate="badge/olive/default/rest">Done</span><b>Summarised 3 runs</b></div><p class="v-meta" data-gate="chat-dock/v-meta/default/rest">From 3 demo run records · no outside changes</p><button class="v-btn -sm" data-open-summary="" data-gate="button/default/sm/rest">Open summary</button></div></div>
<div class="v-igroup" style="background:rgba(251,244,230,.1)" data-gate="input-group/default/default/rest"><input data-msg="" placeholder="Ask anything…" aria-label="Message Cojeev (demo)" style="color:var(--v-on-ink)"><button class="v-ibtn -pink -sm" data-send="" aria-label="Send message" data-gate="chat-dock/v-ibtn/sm/rest"><i class="v-icon " data-icon="send"></i></button></div><p class="v-meta" style="color:rgba(251,244,230,.6)" data-gate="chat-dock/v-meta/default/rest">Demo dock — replies are canned, nothing is sent.</p></div></div>
<script src="../../assets/sprites.js"></script><script src="../../catalog/spec.js"></script><script src="../../js/v.js" data-base="../.."></script><script src="../../js/ui.js"></script><script src="../../js/flow.js"></script><script src="../../js/morph.js"></script><script src="../../js/motion.js"></script>
<script>document.querySelectorAll('[data-indeterminate]').forEach(i=>i.indeterminate=true);addEventListener('load',()=>document.documentElement.dataset.ready='1');</script>
</body></html>
