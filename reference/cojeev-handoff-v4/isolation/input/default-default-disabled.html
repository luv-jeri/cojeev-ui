<!DOCTYPE html>

<body>

0.00" aria-label="Amount" style="text-align:right"><span class="v-affix -pill" data-gate="input/v-affix/default/rest">EUR / month</span></label><label class="v-input" data-gate="input/default/default/rest"><span class="v-disk -olive" data-gate="input/v-disk/default/rest"><i class="v-icon " data-icon="lock"></i></span><input type="password" value="correct-horse" aria-label="Password"><button class="v-affix -pill" type="button" data-gate="input/v-affix/default/rest"><i class="v-icon " data-icon="eye"></i> show</button></label><label class="v-input" data-gate="input/default/default/rest"><span class="v-disk -pink" data-gate="input/v-disk/default/rest"><i class="v-icon " data-icon="clock"></i></span><input type="time" value="16:00" aria-label="Time"><span class="v-affix -pill -pink" data-gate="input/v-affix/default/rest">Fridays</span></label></div><div style="display:grid;gap:12px"><p class="v-caps" data-gate="input/v-caps/default/rest">States</p><div class="v-field -ok" data-gate="field/default/default/rest"><label class="v-label -sm" for="in-ok" data-gate="label/default/sm/rest">Agent name</label><label class="v-input" data-gate="input/default/default/rest"><span class="v-disk -olive" data-gate="input/v-disk/default/rest"><i class="v-icon " data-icon="check"></i></span><input id="in-ok" value="Cedar" aria-describedby="in-okh"></label><div class="v-help" id="in-okh" data-gate="input/v-help/default/rest">Available. Shown on cards and in Runs.</div></div><div class="v-field -invalid" data-gate="field/invalid/default/error"><label class="v-label -sm" for="in-bad" data-gate="label/default/sm/rest">Schedule</label><label class="v-input" data-gate="input/default/default/rest"><span class="v-disk" style="--disk-bg:var(--v-danger-fill);color:#fff" data-gate="input/v-disk/default/rest"><i class="v-icon " data-icon="alert-circle"></i></span><input id="in-bad" value="every 90 mins" aria-invalid="true" aria-describedby="in-badh"></label><div class="v-help" id="in-badh" data-gate="input/v-help/default/rest">Use a time like 16:00 or a weekday.</div></div><input class="v-input" value="Disabled" disabled="" aria-label="Disabled input" data-gate="input/default/default/disabled"><label class="v-input" data-gate="input/default/default/rest"><span class="v-disk" data-gate="input/v-disk/default/rest"><i class="v-icon " data-icon="hash"></i></span><input value="RUN-1EG4-TE5" readonly="" aria-label="Read-only input" style="font-variant-numeric:tabular-nums"><span class="v-affix" data-gate="input/v-affix/default/rest">read only</span></label></div></div></div>

</body></html>
