<!DOCTYPE html>
<html lang="en" data-mode="dark" data-seed="42"><head><meta charset="utf-8"><title>stepper/default/default/rest (dark)</title><link rel="stylesheet" href="../../css/vriksha.css">
<style>html,body{margin:0}body{width:720px;height:240px;overflow:hidden;padding:24px;box-sizing:border-box;background:var(--v-canvas);display:grid;place-items:center;align-content:center;justify-content:center}body>[data-gate]{max-width:100%}</style></head>
<body>
<div data-gate="stepper/default/default/rest" data-canvas="720x240"><div style="display:grid;grid-template-columns:minmax(0,1fr);gap:18px;max-width:560px"><ol class="v-stepper-flow" data-stepper="" data-gate="stepper/default/default/rest"><li class="v-step -done" data-gate="stepper/done/default/rest"><span class="v-step__n">1</span><span class="v-step__t">Choose a host</span></li><li class="v-step -on" aria-current="step" data-gate="stepper/on/default/selected"><span class="v-step__n">2</span><span class="v-step__t">Name the agent</span></li><li class="v-step" data-gate="stepper/v-step/default/rest"><span class="v-step__n">3</span><span class="v-step__t">Set a schedule</span></li><li class="v-step" data-gate="stepper/v-step/default/rest"><span class="v-step__n">4</span><span class="v-step__t">Test it</span></li></ol><div style="display:flex;gap:8px;align-items:center"><button class="v-btn -secondary" data-step-back="" data-gate="button/secondary/default/rest">Back</button><button class="v-btn" data-step-next="" data-gate="button/default/default/rest">Next</button><span class="v-quiet" style="font-size:12.5px" data-step-say="" role="status" data-gate="stepper/v-quiet/default/rest">Stage 2 of 4 · Name the agent</span></div></div></div>
<script src="../../assets/sprites.js"></script><script src="../../catalog/spec.js"></script><script src="../../js/v.js" data-base="../.."></script><script src="../../js/ui.js"></script><script src="../../js/flow.js"></script><script src="../../js/morph.js"></script><script src="../../js/motion.js"></script>

</body></html>
