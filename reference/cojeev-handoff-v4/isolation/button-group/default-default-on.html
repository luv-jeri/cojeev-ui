<!DOCTYPE html>
<html lang="en" data-mode="light" data-seed="42"><head><meta charset="utf-8"><title>button-group/default/default/on</title><link rel="stylesheet" href="../../css/vriksha.css">
<style>html,body{margin:0}body{width:480px;height:240px;overflow:hidden;padding:24px;box-sizing:border-box;background:var(--v-canvas);display:grid;place-items:center;align-content:center;justify-content:center}body>[data-gate]{max-width:100%}</style></head>
<body>
<div data-gate="button-group/default/default/on" data-canvas="480x240"><div style="display:grid;gap:18px"><div style="display:flex;gap:28px;align-items:center;flex-wrap:wrap"><div class="v-utility" data-shapes="" data-gate="joined-utilities/default/default/rest"><button class="v-ibtn" aria-label="Account" data-gate="button-group/v-ibtn/default/rest"><i class="v-icon " data-icon="user"></i></button><button class="v-ibtn" aria-label="Notifications" data-gate="button-group/v-ibtn/default/rest"><i class="v-icon " data-icon="bell"></i></button><button class="v-ibtn" aria-label="Settings" data-gate="button-group/v-ibtn/default/rest"><i class="v-icon " data-icon="settings"></i></button></div><div class="v-utility" data-gate="joined-utilities/default/default/rest"><button class="v-ibtn -ink" aria-label="Account" data-gate="button-group/ink/default/rest"><i class="v-icon " data-icon="user"></i></button><button class="v-ibtn -ink" aria-label="Notifications" data-gate="button-group/ink/default/rest"><i class="v-icon " data-icon="bell"></i></button><button class="v-ibtn -ink" aria-label="Settings" data-gate="button-group/ink/default/rest"><i class="v-icon " data-icon="settings"></i></button></div></div><div style="display:flex;gap:28px;align-items:center;flex-wrap:wrap"><div class="v-seg" data-togglegroup="" data-gate="button-group/default/default/rest"><button class="v-btn -sm" aria-pressed="true" data-gate="button/default/sm/on">Today</button><button class="v-btn -sm" aria-pressed="true" data-gate="button/default/sm/on">Week</button><button class="v-btn -sm" aria-pressed="false" data-gate="button/default/sm/rest">Month</button></div><div class="v-seg -pink" data-togglegroup="" data-gate="button-group/pink/default/rest"><button class="v-btn -sm" aria-pressed="true" data-gate="button/default/sm/on"><i class="v-icon " data-icon="layout-grid"></i>Grid</button><button class="v-btn -sm" aria-pressed="false" data-gate="button/default/sm/rest"><i class="v-icon " data-icon="file-text"></i>List</button><button class="v-btn -sm" aria-pressed="false" data-gate="button/default/sm/rest"><i class="v-icon " data-icon="clock"></i>Timeline</button></div></div><p class="v-meta" data-gate="button-group/v-meta/default/rest">Joined circles take a category hue each and, with <code>data-shapes</code>, their own silhouette; plain <code>-ink</code> keeps the I15 black set. The segmented control is a beige well with a gliding ink or pink pill.</p></div></div>
<script src="../../assets/sprites.js"></script><script src="../../catalog/spec.js"></script><script src="../../js/v.js" data-base="../.."></script><script src="../../js/ui.js"></script><script src="../../js/flow.js"></script><script src="../../js/morph.js"></script><script src="../../js/motion.js"></script>
<script>document.querySelectorAll('[data-indeterminate]').forEach(i=>i.indeterminate=true);addEventListener('load',()=>document.documentElement.dataset.ready='1');</script>
</body></html>
