<!DOCTYPE html>
<html lang="en" data-mode="light" data-seed="42"><head><meta charset="utf-8"><title>carousel/default/default/rest</title><link rel="stylesheet" href="../../css/vriksha.css">
<style>html,body{margin:0}body{width:960px;height:360px;overflow:hidden;padding:24px;box-sizing:border-box;background:var(--v-canvas);display:grid;place-items:center;align-content:center;justify-content:center}body>[data-gate]{max-width:100%}</style></head>
<body>
<div data-gate="carousel/default/default/rest" data-canvas="960x360"><div style="display:grid;grid-template-columns:minmax(0,1.6fr) minmax(220px,1fr);gap:32px;align-items:start"><div class="v-carousel" data-carousel="" data-gate="carousel/default/default/rest"><div class="v-carousel__track"><div class="v-card -pink" style="width:220px" data-gate="card/pink/default/rest"><span class="v-badge -cream" data-gate="badge/cream/default/rest">Skill</span><h3 class="v-card__title" style="margin-top:10px">Tile 1</h3><p class="v-body-2" data-gate="carousel/v-body-2/default/rest">Swipe or use the arrows.</p></div><div class="v-card -yellow" style="width:220px" data-gate="card/yellow/default/rest"><span class="v-badge -cream" data-gate="badge/cream/default/rest">Skill</span><h3 class="v-card__title" style="margin-top:10px">Tile 2</h3><p class="v-body-2" data-gate="carousel/v-body-2/default/rest">Swipe or use the arrows.</p></div><div class="v-card -blue" style="width:220px" data-gate="card/blue/default/rest"><span class="v-badge -cream" data-gate="badge/cream/default/rest">Skill</span><h3 class="v-card__title" style="margin-top:10px">Tile 3</h3><p class="v-body-2" data-gate="carousel/v-body-2/default/rest">Swipe or use the arrows.</p></div><div class="v-card -olive" style="width:220px" data-gate="card/olive/default/rest"><span class="v-badge -cream" data-gate="badge/cream/default/rest">Skill</span><h3 class="v-card__title" style="margin-top:10px">Tile 4</h3><p class="v-body-2" data-gate="carousel/v-body-2/default/rest">Swipe or use the arrows.</p></div><div class="v-card -pink" style="width:220px" data-gate="card/pink/default/rest"><span class="v-badge -cream" data-gate="badge/cream/default/rest">Skill</span><h3 class="v-card__title" style="margin-top:10px">Tile 5</h3><p class="v-body-2" data-gate="carousel/v-body-2/default/rest">Swipe or use the arrows.</p></div></div><div class="v-carousel__nav"><button class="v-ibtn" aria-label="Previous" data-gate="carousel/v-ibtn/default/rest"><i class="v-icon " data-icon="arrow-l"></i></button><button class="v-ibtn" aria-label="Next" data-gate="carousel/v-ibtn/default/rest"><i class="v-icon " data-icon="arrow-r"></i></button></div></div><div class="v-deck" data-gate="carousel/v-deck/default/rest"><div class="v-card -pink" data-gate="card/pink/default/rest"><h3 class="v-card__title">Card deck</h3><p class="v-body-2" data-gate="carousel/v-body-2/default/rest">Next two peek behind.</p></div><div class="v-card -yellow" data-gate="card/yellow/default/rest"></div><div class="v-card -blue" data-gate="card/blue/default/rest"></div></div></div></div>
<script src="../../assets/sprites.js"></script><script src="../../catalog/spec.js"></script><script src="../../js/v.js" data-base="../.."></script><script src="../../js/ui.js"></script><script src="../../js/flow.js"></script><script src="../../js/morph.js"></script><script src="../../js/motion.js"></script>
<script>document.querySelectorAll('[data-indeterminate]').forEach(i=>i.indeterminate=true);addEventListener('load',()=>document.documentElement.dataset.ready='1');</script>
</body></html>
