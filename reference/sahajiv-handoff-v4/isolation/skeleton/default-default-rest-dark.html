<!DOCTYPE html>
<html lang="en" data-mode="dark" data-seed="42"><head><meta charset="utf-8"><title>skeleton/default/default/rest (dark)</title><link rel="stylesheet" href="../../css/vriksha.css">
<style>html,body{margin:0}body{width:480px;height:240px;overflow:hidden;padding:24px;box-sizing:border-box;background:var(--v-canvas);display:grid;place-items:center;align-content:center;justify-content:center}body>[data-gate]{max-width:100%}</style></head>
<body>
<div data-gate="skeleton/default/default/rest" data-canvas="480x240"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:20px"><div class="v-card v-skel-group" data-gate="card/default/default/rest"><div style="display:flex;gap:12px;align-items:center"><span class="v-skel -disk" style="width:40px;height:40px;--i:0" data-gate="skeleton/disk/default/rest"></span><span class="v-skel -line" style="width:58%;--i:1" data-gate="skeleton/line/default/rest"></span></div><span class="v-skel -line" style="--i:2" data-gate="skeleton/line/default/rest"></span><span class="v-skel -line" style="--i:3" data-gate="skeleton/line/default/rest"></span><span class="v-skel -line" style="--i:4" data-gate="skeleton/line/default/rest"></span><span class="v-skel" style="height:34px;width:128px;border-radius:999px;--i:5" data-gate="skeleton/default/default/rest"></span></div><div class="v-async" data-gate="skeleton/v-async/default/rest"><div class="v-async__row"><span class="v-pulse" data-label="" style="--pulse:22px" data-gate="spinner/default/default/rest"></span>Loading three demo runs…</div><div class="v-skel-group" style="width:100%" data-gate="skeleton/v-skel-group/default/rest"><span class="v-skel -line" style="--i:0" data-gate="skeleton/line/default/rest"></span><span class="v-skel -line" style="--i:1" data-gate="skeleton/line/default/rest"></span></div><p class="v-quiet" style="font-size:12.5px" data-gate="skeleton/v-quiet/default/rest">Async content keeps its own space, so nothing jumps when it arrives.</p></div></div></div>
<script src="../../assets/sprites.js"></script><script src="../../catalog/spec.js"></script><script src="../../js/v.js" data-base="../.."></script><script src="../../js/ui.js"></script><script src="../../js/flow.js"></script><script src="../../js/morph.js"></script><script src="../../js/motion.js"></script>
<script>document.querySelectorAll('[data-indeterminate]').forEach(i=>i.indeterminate=true);addEventListener('load',()=>document.documentElement.dataset.ready='1');</script>
</body></html>
