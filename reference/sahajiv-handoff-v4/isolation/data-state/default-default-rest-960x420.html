<!DOCTYPE html>
<html lang="en" data-mode="light" data-seed="42"><head><meta charset="utf-8"><title>data-state/default/default/rest</title><link rel="stylesheet" href="../../css/vriksha.css">
<style>html,body{margin:0}body{width:960px;height:420px;overflow:hidden;padding:24px;box-sizing:border-box;background:var(--v-canvas);display:grid;place-items:center;align-content:center;justify-content:center}body>[data-gate]{max-width:100%}</style></head>
<body>
<div data-gate="data-state/default/default/rest" data-canvas="960x420"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px"><div class="v-state" data-gate="data-state/default/default/rest"><span class="v-skel -pill" style="width:120px;height:14px" data-gate="skeleton/default/default/rest"></span><span class="v-skel" style="width:80%;height:12px" data-gate="skeleton/default/default/rest"></span><span class="v-skel -pill" style="width:90px;height:32px" data-gate="skeleton/default/default/rest"></span></div><div class="v-state -partial" data-gate="data-state/partial/default/rest"><div class="v-state__word"><i class="v-icon " data-icon="alert-triangle"></i>Partial</div><div class="v-state__why">Cursor reported runs but not usage. Shown values are complete; usage is unavailable.</div></div><div class="v-state -unavail" data-gate="data-state/unavail/default/rest"><div class="v-state__word">Unavailable</div><div class="v-state__why">Codex does not expose limits. This is not zero.</div></div><div class="v-state -error" data-gate="data-state/error/default/rest"><div class="v-state__word"><i class="v-icon " data-icon="alert-circle"></i>Failed to read</div><div class="v-state__why">Permission denied on ~/.cursor. Nothing was changed.</div><button class="v-btn -sm" data-gate="button/default/sm/rest">Retry</button></div><div class="v-state" data-gate="data-state/default/default/rest"><div class="v-state__word"><span class="v-stamp -stale" data-gate="observation/stale/default/rest">observed yesterday</span></div><div class="v-state__why">Stale: no new records for 26 h. Values may be outdated.</div></div></div></div>
<script src="../../assets/sprites.js"></script><script src="../../catalog/spec.js"></script><script src="../../js/v.js" data-base="../.."></script><script src="../../js/ui.js"></script><script src="../../js/flow.js"></script><script src="../../js/morph.js"></script><script src="../../js/motion.js"></script>
<script>document.querySelectorAll('[data-indeterminate]').forEach(i=>i.indeterminate=true);addEventListener('load',()=>document.documentElement.dataset.ready='1');</script>
</body></html>
