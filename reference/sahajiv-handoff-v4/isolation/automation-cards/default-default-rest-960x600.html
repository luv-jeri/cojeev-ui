<!DOCTYPE html>
<html lang="en" data-mode="light" data-seed="42"><head><meta charset="utf-8"><title>automation-cards/default/default/rest</title><link rel="stylesheet" href="../../css/vriksha.css">
<style>html,body{margin:0}body{width:960px;height:600px;overflow:hidden;padding:24px;box-sizing:border-box;background:var(--v-canvas);display:grid;place-items:center;align-content:center;justify-content:center}body>[data-gate]{max-width:100%}</style></head>
<body>
<div data-gate="automation-cards/default/default/rest" data-canvas="960x600"><div style="display:grid;grid-template-columns:minmax(0,1fr);gap:16px"><div class="v-upgrade" data-gate="automation-cards/v-upgrade/default/rest"><span class="v-disk -olive" data-gate="automation-cards/olive/default/rest"><i class="v-icon " data-icon="sparkles"></i></span><div><b>Upgraded 3 one-step automations to agents</b><div class="v-meta" data-gate="automation-cards/v-meta/default/rest">Cedar, Moss, Willow · nothing ran</div></div><button class="v-ibtn -sm" aria-label="Dismiss" data-gate="automation-cards/v-ibtn/sm/rest"><i class="v-icon " data-icon="x"></i></button></div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px"><div class="v-card -yellow" style="display:grid;gap:10px" data-gate="card/yellow/default/rest"><i class="v-wm v-shape -cross" data-gate="automation-cards/cross/default/rest"></i><span class="v-badge -cream" data-gate="badge/cream/default/rest">Idea</span><h3 class="v-title" data-gate="automation-cards/v-title/default/rest">You summarised 6 runs by hand this week</h3><p class="v-body" data-gate="automation-cards/v-body/default/rest">Evidence: 6 chat requests, same shape.</p><button class="v-btn" data-gate="button/default/default/rest">Build this</button></div><div class="v-card -automation" style="display:grid;gap:10px" data-gate="card/default/default/rest"><div style="display:flex;gap:10px;align-items:center"><span class="v-disk -yellow" data-gate="automation-cards/yellow/default/rest"><i class="v-icon " data-icon="repeat"></i></span><b style="flex:1">Weekly digest</b><span class="v-switch" data-gate="switch/default/default/rest"><input type="checkbox" checked="" aria-label="Enabled"></span></div><div class="v-health -ok" data-gate="health-line/ok/default/rest"><i class="v-icon " data-icon="check"></i><span class="v-word" data-gate="automation-cards/v-word/default/rest">Working</span><span class="v-age" data-gate="automation-cards/v-age/default/rest">ran 2 h ago</span></div><div style="display:flex;gap:8px"><span class="v-badge -lg" data-gate="badge/default/lg/rest">Fridays 16:00</span><span class="v-badge -lg -cream" data-gate="badge/cream/lg/rest">Europe/Berlin</span></div></div><div class="v-card -automation" style="display:grid;gap:10px" data-gate="card/default/default/rest"><b>Schedule</b><div class="v-weekdays" data-gate="automation-cards/v-weekdays/default/rest"><label><input type="checkbox">MO</label><label><input type="checkbox">TU</label><label><input type="checkbox">WE</label><label><input type="checkbox">TH</label><label><input type="checkbox" checked="">FR</label><label><input type="checkbox">SA</label><label><input type="checkbox">SU</label></div><div style="display:flex;gap:8px"><select class="v-native" aria-label="Time" data-gate="native-select/default/default/rest"><option>16:00</option><option>09:00</option></select><select class="v-native" aria-label="Timezone" data-gate="native-select/default/default/rest"><option>Europe/Berlin</option></select></div><div class="v-meta" data-gate="automation-cards/v-meta/default/rest">Next run: Fri 13 Sept, 16:00 · in 2 d 4 h</div></div></div></div></div>
<script src="../../assets/sprites.js"></script><script src="../../catalog/spec.js"></script><script src="../../js/v.js" data-base="../.."></script><script src="../../js/ui.js"></script><script src="../../js/flow.js"></script><script src="../../js/morph.js"></script><script src="../../js/motion.js"></script>
<script>document.querySelectorAll('[data-indeterminate]').forEach(i=>i.indeterminate=true);addEventListener('load',()=>document.documentElement.dataset.ready='1');</script>
</body></html>
