<!DOCTYPE html>
<html lang="en" data-mode="light" data-seed="42"><head><meta charset="utf-8"><title>segmented-ring/default/default/rest</title><link rel="stylesheet" href="../../css/vriksha.css">
<style>html,body{margin:0}body{width:480px;height:360px;overflow:hidden;padding:24px;box-sizing:border-box;background:var(--v-canvas);display:grid;place-items:center;align-content:center;justify-content:center}body>[data-gate]{max-width:100%}</style></head>
<body>
<div data-gate="segmented-ring/default/default/rest" data-canvas="480x360"><div style="display:flex;gap:clamp(16px,4vw,36px);align-items:center;flex-wrap:wrap;max-width:100%">
<div class="v-ring -draw" data-segs="blue:3.4,yellow:2.8,olive:1.6,pink:1" data-sw="12" data-gap="7" data-unit="of 10" data-legend="Work,Automations,Memory,Library" style="--sz:min(240px,72vw)" data-gate="segmented-ring/draw/default/rest"><div class="v-ring__c"><span class="v-hero" data-total="" data-gate="segmented-ring/v-hero/default/rest">8.8</span><span class="v-caption" data-gate="segmented-ring/v-caption/default/rest">of 10 · 4 areas</span></div></div>
<div style="display:grid;gap:10px;min-width:min(200px,100%);flex:1 1 200px"><p class="v-meta" data-gate="segmented-ring/v-meta/default/rest">Illustrative demo data. The ring, the centre value and this table are one dataset.</p><div style="display:flex;gap:10px;align-items:center;font-size:13px"><span style="width:12px;height:12px;border-radius:50%;background:var(--v-blue);flex:none"></span><span style="flex:1">Work</span><b class="v-tnum" data-gate="segmented-ring/v-tnum/default/rest">3.4</b></div><div style="display:flex;gap:10px;align-items:center;font-size:13px"><span style="width:12px;height:12px;border-radius:50%;background:var(--v-yellow);flex:none"></span><span style="flex:1">Automations</span><b class="v-tnum" data-gate="segmented-ring/v-tnum/default/rest">2.8</b></div><div style="display:flex;gap:10px;align-items:center;font-size:13px"><span style="width:12px;height:12px;border-radius:50%;background:var(--v-olive);flex:none"></span><span style="flex:1">Memory</span><b class="v-tnum" data-gate="segmented-ring/v-tnum/default/rest">1.6</b></div><div style="display:flex;gap:10px;align-items:center;font-size:13px"><span style="width:12px;height:12px;border-radius:50%;background:var(--v-pink);flex:none"></span><span style="flex:1">Library</span><b class="v-tnum" data-gate="segmented-ring/v-tnum/default/rest">1.0</b></div><div style="display:flex;gap:10px;align-items:center;font-size:13px;border-top:1px solid var(--v-border);padding-top:8px"><span style="width:12px;flex:none"></span><span style="flex:1">Total shown in the centre</span><b class="v-tnum" data-gate="segmented-ring/v-tnum/default/rest">8.8</b></div></div></div></div>
<script src="../../assets/sprites.js"></script><script src="../../catalog/spec.js"></script><script src="../../js/v.js" data-base="../.."></script><script src="../../js/ui.js"></script><script src="../../js/flow.js"></script><script src="../../js/morph.js"></script><script src="../../js/motion.js"></script>
<script>document.querySelectorAll('[data-indeterminate]').forEach(i=>i.indeterminate=true);addEventListener('load',()=>document.documentElement.dataset.ready='1');</script>
</body></html>
