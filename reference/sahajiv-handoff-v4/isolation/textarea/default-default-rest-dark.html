<!DOCTYPE html>
<html lang="en" data-mode="dark" data-seed="42"><head><meta charset="utf-8"><title>textarea/default/default/rest (dark)</title><link rel="stylesheet" href="../../css/vriksha.css">
<style>html,body{margin:0}body{width:480px;height:240px;overflow:hidden;padding:24px;box-sizing:border-box;background:var(--v-canvas);display:grid;place-items:center;align-content:center;justify-content:center}body>[data-gate]{max-width:100%}</style></head>
<body>
<div data-gate="textarea/default/default/rest" data-canvas="480x240"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:24px;align-items:start"><div class="v-composer" data-gate="textarea/v-composer/default/rest"><textarea class="v-textarea" placeholder="Ask SahaJiv anything…" aria-label="Message" rows="3" data-gate="textarea/default/default/rest"></textarea><div class="v-composer__bar"><button class="v-ibtn" aria-label="Attach a file" data-gate="textarea/v-ibtn/default/rest"><i class="v-icon " data-icon="plus"></i></button><button class="v-ibtn" aria-label="Mention an agent" data-gate="textarea/v-ibtn/default/rest"><i class="v-icon " data-icon="at-sign"></i></button><span class="v-meta" data-gate="textarea/v-meta/default/rest">Shift + Enter for a new line</span><button class="v-ibtn -pink" aria-label="Send" data-gate="textarea/pink/default/rest"><i class="v-icon " data-icon="send"></i></button></div></div><div class="v-field" data-gate="field/default/default/rest"><label class="v-label -sm" for="ta-notes" data-gate="label/default/sm/rest">Notes for the run</label><textarea class="v-textarea" id="ta-notes" aria-describedby="ta-h" placeholder="What should Cedar keep in mind?" data-gate="textarea/default/default/rest"></textarea><div class="v-help" id="ta-h" data-gate="textarea/v-help/default/rest">Saved with the run record. Plain text only.</div></div></div></div>
<script src="../../assets/sprites.js"></script><script src="../../catalog/spec.js"></script><script src="../../js/v.js" data-base="../.."></script><script src="../../js/ui.js"></script><script src="../../js/flow.js"></script><script src="../../js/morph.js"></script><script src="../../js/motion.js"></script>
<script>document.querySelectorAll('[data-indeterminate]').forEach(i=>i.indeterminate=true);addEventListener('load',()=>document.documentElement.dataset.ready='1');</script>
</body></html>
