<!DOCTYPE html>
<html lang="en" data-mode="light" data-seed="42"><head><meta charset="utf-8"><title>Button Group · demo</title><link rel="stylesheet" href="../../css/vriksha.css">
<style>html,body{margin:0}body{min-height:100vh;padding:32px;box-sizing:border-box;background:var(--v-canvas);display:grid;place-items:center;align-content:center;justify-content:center}body>[data-gate]{max-width:100%}</style></head>
<body>
<section class="entry" id="button-group" data-gate="button-group/demo" style="width:min(100%,1120px)"><h1 class="v-section" style="margin:0 0 6px">Button Group</h1><p class="v-meta" style="margin:0 0 20px">.v-utility (joined black circles) · .v-seg (segmented pills, aria-pressed)</p><div class="demo"><div style="display:grid;gap:18px"><div style="display:flex;gap:28px;align-items:center;flex-wrap:wrap"><div class="v-utility" data-shapes><button class="v-ibtn" aria-label="Account"><i class="v-icon " data-icon="user"></i></button><button class="v-ibtn" aria-label="Notifications"><i class="v-icon " data-icon="bell"></i></button><button class="v-ibtn" aria-label="Settings"><i class="v-icon " data-icon="settings"></i></button></div><div class="v-utility"><button class="v-ibtn -ink" aria-label="Account"><i class="v-icon " data-icon="user"></i></button><button class="v-ibtn -ink" aria-label="Notifications"><i class="v-icon " data-icon="bell"></i></button><button class="v-ibtn -ink" aria-label="Settings"><i class="v-icon " data-icon="settings"></i></button></div></div><div style="display:flex;gap:28px;align-items:center;flex-wrap:wrap"><div class="v-seg" data-togglegroup><button class="v-btn -sm" aria-pressed="false">Today</button><button class="v-btn -sm" aria-pressed="true">Week</button><button class="v-btn -sm" aria-pressed="false">Month</button></div><div class="v-seg -pink" data-togglegroup><button class="v-btn -sm" aria-pressed="true"><i class="v-icon " data-icon="layout-grid"></i>Grid</button><button class="v-btn -sm" aria-pressed="false"><i class="v-icon " data-icon="file-text"></i>List</button><button class="v-btn -sm" aria-pressed="false"><i class="v-icon " data-icon="clock"></i>Timeline</button></div></div><p class="v-meta">Joined circles take a category hue each and, with <code>data-shapes</code>, their own silhouette; plain <code>-ink</code> keeps the I15 black set. The segmented control is a beige well with a gliding ink or pink pill.</p></div></div></section>
<script src="../../assets/sprites.js"></script><script src="../../catalog/spec.js"></script><script src="../../js/v.js" data-base="../.."></script><script src="../../js/ui.js"></script><script src="../../js/flow.js"></script><script src="../../js/morph.js"></script><script src="../../js/motion.js"></script><script src="../../catalog/demo-behaviour.js"></script><script>(async()=>{await V.init(document.body);if(window.VUI)VUI.init(document.body);if(window.VLive)VLive.init(document.body)})()</script>
<script>document.querySelectorAll('[data-indeterminate]').forEach(i=>i.indeterminate=true);addEventListener('load',()=>document.documentElement.dataset.ready='1');</script>
</body></html>
