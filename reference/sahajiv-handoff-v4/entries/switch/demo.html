<!DOCTYPE html>
<html lang="en" data-mode="light" data-seed="42"><head><meta charset="utf-8"><title>Switch · demo</title><link rel="stylesheet" href="../../css/vriksha.css">
<style>html,body{margin:0}body{min-height:100vh;padding:32px;box-sizing:border-box;background:var(--v-canvas);display:grid;place-items:center;align-content:center;justify-content:center}body>[data-gate]{max-width:100%}</style></head>
<body>
<section class="entry" id="switch" data-gate="switch/demo" style="width:min(100%,1120px)"><h1 class="v-section" style="margin:0 0 6px">Switch</h1><p class="v-meta" style="margin:0 0 20px">label.v-switch > input[type=checkbox] · black track / cream thumb when on; beige when off</p><div class="demo"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:28px;align-items:start"><div style="display:grid;gap:0;max-width:380px"><label class="v-switchrow"><b>Notification</b><small>A quiet receipt when a run finishes.</small><span class="v-switch"><input type="checkbox" checked></span></label><label class="v-switchrow"><b>Set a reminder</b><small>Fridays at 16:00 in your timezone.</small><span class="v-switch -yellow"><input type="checkbox"></span></label><label class="v-switchrow"><b>Remember this project</b><small>Adds Cedar to Memory.</small><span class="v-switch -olive"><input type="checkbox" checked></span></label><label class="v-switchrow"><b>Not supported on this host</b><small>Cursor cannot report usage.</small><span class="v-switch"><input type="checkbox" disabled></span></label></div><div style="display:grid;gap:10px"><label class="v-switchrow -card"><b>Ask before every push</b><small>Safest for shared repos.</small><span class="v-switch"><input type="checkbox" checked></span></label><label class="v-switchrow -card"><b>Work view is the home screen</b><small>Otherwise SahaJiv opens where you left off.</small><span class="v-switch -blue"><input type="checkbox"></span></label><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding-top:6px"><span class="v-switch -sm"><input type="checkbox" checked aria-label="Small on"></span><span class="v-switch -sm"><input type="checkbox" aria-label="Small off"></span><span class="v-switch -ink"><input type="checkbox" checked aria-label="Ink on"></span><span class="v-meta">-sm · -ink</span></div></div></div></div></section>
<script src="../../assets/sprites.js"></script><script src="../../catalog/spec.js"></script><script src="../../js/v.js" data-base="../.."></script><script src="../../js/ui.js"></script><script src="../../js/flow.js"></script><script src="../../js/morph.js"></script><script src="../../js/motion.js"></script><script src="../../catalog/demo-behaviour.js"></script><script>(async()=>{await V.init(document.body);if(window.VUI)VUI.init(document.body);if(window.VLive)VLive.init(document.body)})()</script>
<script>document.querySelectorAll('[data-indeterminate]').forEach(i=>i.indeterminate=true);addEventListener('load',()=>document.documentElement.dataset.ready='1');</script>
</body></html>
