<!DOCTYPE html>
<html lang="en" data-mode="light" data-seed="42"><head><meta charset="utf-8"><title>Dropzone · demo</title><link rel="stylesheet" href="../../css/vriksha.css">
<style>html,body{margin:0}body{min-height:100vh;padding:32px;box-sizing:border-box;background:var(--v-canvas);display:grid;place-items:center;align-content:center;justify-content:center}body>[data-gate]{max-width:100%}</style></head>
<body>
<section class="entry" id="dropzone" data-gate="dropzone/demo" style="width:min(100%,1120px)"><h1 class="v-section" style="margin:0 0 6px">Dropzone</h1><p class="v-meta" style="margin:0 0 20px">.v-drop[data-drop] · a cut-paper well that lifts and tints on dragover, accepts keyboard activation, and reports each file as a simulated record with a receipt · nothing is uploaded and no file is read</p><div class="demo"><div style="display:grid;grid-template-columns:minmax(0,1fr);gap:14px;max-width:520px"><div class="v-drop" data-drop tabindex="0" role="button" aria-label="Add demo files (simulated)"><span class="v-pulse" data-label="" style="--pulse:34px;--pulse-c:var(--v-olive)"></span><b style="font-size:16px">Drop files here</b><span class="v-quiet" style="font-size:13px">or press Enter — this demo simulates the record, nothing is uploaded</span></div><div data-drop-log style="display:grid;gap:8px"></div></div></div></section>
<script src="../../assets/sprites.js"></script><script src="../../catalog/spec.js"></script><script src="../../js/v.js" data-base="../.."></script><script src="../../js/ui.js"></script><script src="../../js/flow.js"></script><script src="../../js/morph.js"></script><script src="../../js/motion.js"></script><script src="../../catalog/demo-behaviour.js"></script><script>(async()=>{await V.init(document.body);if(window.VUI)VUI.init(document.body);if(window.VLive)VLive.init(document.body)})()</script>
<script>document.querySelectorAll('[data-indeterminate]').forEach(i=>i.indeterminate=true);addEventListener('load',()=>document.documentElement.dataset.ready='1');</script>
</body></html>
