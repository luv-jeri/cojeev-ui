<!DOCTYPE html>
<html lang="en" data-mode="light" data-seed="42"><head><meta charset="utf-8"><title>Questionnaire · demo</title><link rel="stylesheet" href="../../css/vriksha.css">
<style>html,body{margin:0}body{min-height:100vh;padding:32px;box-sizing:border-box;background:var(--v-canvas);display:grid;place-items:center;align-content:center;justify-content:center}body>[data-gate]{max-width:100%}</style></head>
<body>
<section class="entry" id="questionnaire" data-gate="questionnaire/demo" style="width:min(100%,1120px)"><h1 class="v-section" style="margin:0 0 6px">Questionnaire</h1><p class="v-meta" style="margin:0 0 20px">.v-quest > __progress + __q (.v-label + __opts/.v-quest__opt | .v-iradio | .v-weekdays | .v-check)</p><div class="demo"><div class="v-quest" style="max-width:460px"><div class="v-quest__progress"><div class="v-track -sm" style="max-width:140px"><i style="--p:66%;--c:var(--v-pink)"></i></div><span>Question <b>2</b> of 3</span></div><div class="v-quest__q"><label class="v-label">Consume with meal</label><div class="v-iradios"><label class="v-iradio"><input type="radio" name="q1"><i class="v-icon " data-icon="sun"></i><small>Breakfast</small></label><label class="v-iradio"><input type="radio" name="q1" checked><i class="v-icon " data-icon="coffee"></i><small>Lunch</small></label><label class="v-iradio"><input type="radio" name="q1"><i class="v-icon " data-icon="moon"></i><small>Dinner</small></label></div></div><div class="v-quest__q"><label class="v-label">Schedule</label><div class="v-weekdays"><label><input type="checkbox" checked>MO</label><label><input type="checkbox" checked>TU</label><label><input type="checkbox" checked>WE</label><label><input type="checkbox" checked>TH</label><label><input type="checkbox" checked>FR</label><label><input type="checkbox" >SA</label><label><input type="checkbox" >SU</label></div><label class="v-check"><input type="checkbox"> Everyday</label></div><div class="v-quest__q"><label class="v-label">Which host?</label><div class="v-quest__opts"><label class="v-quest__opt"><input type="radio" name="q2" checked><span class="v-disk -sm -pink"><i class="v-icon " data-icon="terminal"></i></span><span class="v-quest__opt-body"><b>Claude Code</b><small>Runs in your terminal · asks before pushing</small></span></label><label class="v-quest__opt"><input type="radio" name="q2"><span class="v-disk -sm -blue"><i class="v-icon " data-icon="monitor"></i></span><span class="v-quest__opt-body"><b>Cursor</b><small>Runs in the editor</small></span></label><label class="v-quest__opt"><input type="radio" name="q2"><span class="v-disk -sm -yellow"><i class="v-icon " data-icon="cpu"></i></span><span class="v-quest__opt-body"><b>Codex</b><small>Runs in the cloud</small></span></label></div></div><div style="display:flex;gap:10px;justify-content:space-between;margin-top:4px"><button class="v-btn -secondary">Back</button><button class="v-btn">Next <i class="v-icon " data-icon="arrow-r"></i></button></div></div></div></section>
<script src="../../assets/sprites.js"></script><script src="../../catalog/spec.js"></script><script src="../../js/v.js" data-base="../.."></script><script src="../../js/ui.js"></script><script src="../../js/flow.js"></script><script src="../../js/morph.js"></script><script src="../../js/motion.js"></script><script src="../../catalog/demo-behaviour.js"></script><script>(async()=>{await V.init(document.body);if(window.VUI)VUI.init(document.body);if(window.VLive)VLive.init(document.body)})()</script>
<script>document.querySelectorAll('[data-indeterminate]').forEach(i=>i.indeterminate=true);addEventListener('load',()=>document.documentElement.dataset.ready='1');</script>
</body></html>
