<!DOCTYPE html>
<html lang="en" data-mode="light" data-seed="42"><head><meta charset="utf-8"><title>Progress · demo</title><link rel="stylesheet" href="../../css/vriksha.css">
<style>html,body{margin:0}body{min-height:100vh;padding:32px;box-sizing:border-box;background:var(--v-canvas);display:grid;place-items:center;align-content:center;justify-content:center}body>[data-gate]{max-width:100%}</style></head>
<body>
<section class="entry" id="progress" data-gate="progress/demo" style="width:min(100%,1120px)"><h1 class="v-section" style="margin:0 0 6px">Progress</h1><p class="v-meta" style="margin:0 0 20px">.v-track[.-lg|.-sm|.-cream|.-unavail] > i[style=--p;--c] · role=progressbar · .v-prow row (disk + label + track + value "of 10")</p><div class="demo"><div style="display:grid;gap:16px;max-width:420px"><div class="v-track" role="progressbar" aria-valuenow="83" aria-valuemin="0" aria-valuemax="100"><i style="--p:83%;--c:var(--v-yellow)"></i></div><div class="v-track -lg -cream" style="background:var(--v-beige)"><i style="--p:47%;--c:var(--v-pink)"></i></div><div class="v-track -sm"><i style="--p:20%;--c:var(--v-blue)"></i></div><div class="v-track -unavail" role="progressbar" aria-valuetext="unavailable"></div><div class="v-meta">Striped = unavailable, not zero.</div></div></div></section>
<script src="../../assets/sprites.js"></script><script src="../../catalog/spec.js"></script><script src="../../js/v.js" data-base="../.."></script><script src="../../js/ui.js"></script><script src="../../js/flow.js"></script><script src="../../js/morph.js"></script><script src="../../js/motion.js"></script><script src="../../catalog/demo-behaviour.js"></script><script>(async()=>{await V.init(document.body);if(window.VUI)VUI.init(document.body);if(window.VLive)VLive.init(document.body)})()</script>
<script>document.querySelectorAll('[data-indeterminate]').forEach(i=>i.indeterminate=true);addEventListener('load',()=>document.documentElement.dataset.ready='1');</script>
</body></html>
