<!DOCTYPE html>
<html lang="en" data-mode="light" data-seed="42"><head><meta charset="utf-8"><title>Category Tile · demo</title><link rel="stylesheet" href="../../css/vriksha.css">
<style>html,body{margin:0}body{min-height:100vh;padding:32px;box-sizing:border-box;background:var(--v-canvas);display:grid;place-items:center;align-content:center;justify-content:center}body>[data-gate]{max-width:100%}</style></head>
<body>
<section class="entry" id="category-tile" data-gate="category-tile/demo" style="width:min(100%,1120px)"><h1 class="v-section" style="margin:0 0 6px">Category Tile</h1><p class="v-meta" style="margin:0 0 20px">.v-ctile style="--sz" > .v-shape|[data-shape] + one span (word) [+ small] · .v-cluster positions tiles absolutely · alive: add data-morph data-shape</p><div class="demo"><div style="display:flex;gap:16px;flex-wrap:wrap"><div class="v-ctile"><i class="v-shape -star-8" style="--c:var(--v-blue)"></i><span>work</span></div><div class="v-ctile"><i class="v-shape -cross" style="--c:var(--v-yellow)"></i><span>runs</span></div><div class="v-ctile"><i class="v-shape -blob-4" style="--c:var(--v-olive)"></i><span>memory</span></div><div class="v-ctile"><i class="v-shape -heart" style="--c:var(--v-pink)"></i><span>needs you</span></div><div class="v-ctile"><i class="v-shape -droplet" style="--c:var(--v-blue)"></i><span>ai apps</span></div><div class="v-ctile v-alive" data-morph="fill" data-shape="crescent" style="--mfill:var(--v-yellow)"><span>alive</span></div></div></div></section>
<script src="../../assets/sprites.js"></script><script src="../../catalog/spec.js"></script><script src="../../js/v.js" data-base="../.."></script><script src="../../js/ui.js"></script><script src="../../js/flow.js"></script><script src="../../js/morph.js"></script><script src="../../js/motion.js"></script><script src="../../catalog/demo-behaviour.js"></script><script>(async()=>{await V.init(document.body);if(window.VUI)VUI.init(document.body);if(window.VLive)VLive.init(document.body)})()</script>
<script>document.querySelectorAll('[data-indeterminate]').forEach(i=>i.indeterminate=true);addEventListener('load',()=>document.documentElement.dataset.ready='1');</script>
</body></html>
