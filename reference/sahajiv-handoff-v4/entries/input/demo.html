<!DOCTYPE html>
<html lang="en" data-mode="light" data-seed="42"><head><meta charset="utf-8"><title>Input · demo</title><link rel="stylesheet" href="../../css/vriksha.css">
<style>html,body{margin:0}body{min-height:100vh;padding:32px;box-sizing:border-box;background:var(--v-canvas);display:grid;place-items:center;align-content:center;justify-content:center}body>[data-gate]{max-width:100%}</style></head>
<body>
<section class="entry" id="input" data-gate="input/demo" style="width:min(100%,1120px)"><h1 class="v-section" style="margin:0 0 6px">Input</h1><p class="v-meta" style="margin:0 0 20px">.v-input[.-cream|.-sm] · beige pill, pink focus ring + tint, reserved message line via Field · disabled 50 %</p><div class="demo"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:24px 32px"><div style="display:grid;gap:12px"><p class="v-caps">Sizes and surfaces</p><input class="v-input -sm" placeholder="Small · 40" aria-label="Small input"><input class="v-input" placeholder="Default · 48" aria-label="Default input"><input class="v-input -lg" placeholder="Large · 56" aria-label="Large input"><input class="v-input -cream" placeholder="Cream with hairline (topbar)" aria-label="Cream input"><label class="v-input -ink"><span class="v-disk"><i class="v-icon " data-icon="sparkles"></i></span><input placeholder="Ask SahaJiv anything…" aria-label="Ink input"></label></div><div style="display:grid;gap:12px"><p class="v-caps">With glyph tiles and affixes</p><label class="v-input"><span class="v-disk -pink"><i class="v-icon " data-icon="search"></i></span><input type="search" placeholder="Search runs…" aria-label="Search"></label><label class="v-input"><span class="v-disk -blue"><i class="v-icon " data-icon="user"></i></span><input value="sanjay@intelly.app" aria-label="Email"><button class="v-clear" type="button" aria-label="Clear"><i class="v-icon " data-icon="x"></i></button></label><label class="v-input"><span class="v-disk -yellow"><i class="v-icon " data-icon="tag"></i></span><input inputmode="decimal" value="1,240.00" aria-label="Amount" style="text-align:right"><span class="v-affix -pill">EUR / month</span></label><label class="v-input"><span class="v-disk -olive"><i class="v-icon " data-icon="lock"></i></span><input type="password" value="correct-horse" aria-label="Password"><button class="v-affix -pill" type="button"><i class="v-icon " data-icon="eye"></i> show</button></label><label class="v-input"><span class="v-disk -pink"><i class="v-icon " data-icon="clock"></i></span><input type="time" value="16:00" aria-label="Time"><span class="v-affix -pill -pink">Fridays</span></label></div><div style="display:grid;gap:12px"><p class="v-caps">States</p><div class="v-field -ok"><label class="v-label -sm" for="in-ok">Agent name</label><label class="v-input"><span class="v-disk -olive"><i class="v-icon " data-icon="check"></i></span><input id="in-ok" value="Cedar" aria-describedby="in-okh"></label><div class="v-help" id="in-okh">Available. Shown on cards and in Runs.</div></div><div class="v-field -invalid"><label class="v-label -sm" for="in-bad">Schedule</label><label class="v-input"><span class="v-disk" style="--disk-bg:var(--v-danger-fill);color:#fff"><i class="v-icon " data-icon="alert-circle"></i></span><input id="in-bad" value="every 90 mins" aria-invalid="true" aria-describedby="in-badh"></label><div class="v-help" id="in-badh">Use a time like 16:00 or a weekday.</div></div><input class="v-input" value="Disabled" disabled aria-label="Disabled input"><label class="v-input"><span class="v-disk"><i class="v-icon " data-icon="hash"></i></span><input value="RUN-1EG4-TE5" readonly aria-label="Read-only input" style="font-variant-numeric:tabular-nums"><span class="v-affix">read only</span></label></div></div></div></section>
<script src="../../assets/sprites.js"></script><script src="../../catalog/spec.js"></script><script src="../../js/v.js" data-base="../.."></script><script src="../../js/ui.js"></script><script src="../../js/flow.js"></script><script src="../../js/morph.js"></script><script src="../../js/motion.js"></script><script src="../../catalog/demo-behaviour.js"></script><script>(async()=>{await V.init(document.body);if(window.VUI)VUI.init(document.body);if(window.VLive)VLive.init(document.body)})()</script>
<script>document.querySelectorAll('[data-indeterminate]').forEach(i=>i.indeterminate=true);addEventListener('load',()=>document.documentElement.dataset.ready='1');</script>
</body></html>
