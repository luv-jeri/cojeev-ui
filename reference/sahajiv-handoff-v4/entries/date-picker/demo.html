<!DOCTYPE html>
<html lang="en" data-mode="light" data-seed="42"><head><meta charset="utf-8"><title>Date Picker · demo</title><link rel="stylesheet" href="../../css/vriksha.css">
<style>html,body{margin:0}body{min-height:100vh;padding:32px;box-sizing:border-box;background:var(--v-canvas);display:grid;place-items:center;align-content:center;justify-content:center}body>[data-gate]{max-width:100%}</style></head>
<body>
<section class="entry" id="date-picker" data-gate="date-picker/demo" style="width:min(100%,1120px)"><h1 class="v-section" style="margin:0 0 6px">Date Picker</h1><p class="v-meta" style="margin:0 0 20px">.v-menuhost[data-datepicker] > button.v-select.-ink > [data-value] + .v-popover > .v-cal[data-cal] · Escape closes, focus returns</p><div class="demo"><div class="v-menuhost" data-datepicker><button class="v-select -ink"><span data-value>15 May 2024</span><i class="v-icon " data-icon="chevron-down"></i></button><div class="v-popover" style="position:absolute;top:calc(100% + 8px);left:0;z-index:40;width:340px" hidden><div class="v-cal" data-cal data-date="2024-05-15" data-selected="2024-05-15"></div></div></div><div style="height:12px"></div></div></section>
<script src="../../assets/sprites.js"></script><script src="../../catalog/spec.js"></script><script src="../../js/v.js" data-base="../.."></script><script src="../../js/ui.js"></script><script src="../../js/flow.js"></script><script src="../../js/morph.js"></script><script src="../../js/motion.js"></script><script src="../../catalog/demo-behaviour.js"></script><script>(async()=>{await V.init(document.body);if(window.VUI)VUI.init(document.body);if(window.VLive)VLive.init(document.body)})()</script>
<script>document.querySelectorAll('[data-indeterminate]').forEach(i=>i.indeterminate=true);addEventListener('load',()=>document.documentElement.dataset.ready='1');</script>
</body></html>
