<!DOCTYPE html>
<html lang="en" data-mode="light" data-seed="42"><head><meta charset="utf-8"><title>Drawer · demo</title><link rel="stylesheet" href="../../css/vriksha.css">
<style>html,body{margin:0}body{min-height:100vh;padding:32px;box-sizing:border-box;background:var(--v-canvas);display:grid;place-items:center;align-content:center;justify-content:center}body>[data-gate]{max-width:100%}</style></head>
<body>
<section class="entry" id="drawer" data-gate="drawer/demo" style="width:min(100%,1120px)"><h1 class="v-section" style="margin:0 0 6px">Drawer</h1><p class="v-meta" style="margin:0 0 20px">.v-drawer[data-drawer] black bottom panel attached above the dock · [data-drawer-open] · Escape / scrim / [data-close]</p><div class="demo"><button class="v-btn" data-drawer-open="#dr1">Open drawer</button><div class="v-drawer" id="dr1" data-drawer aria-labelledby="dr1t" hidden style="max-width:420px;margin:auto"><div class="v-dockpanel__title" id="dr1t">Add…</div><div style="display:grid;gap:4px"><button class="v-item" style="background:transparent;color:var(--v-on-ink);min-height:52px" data-close><span class="v-disk -lg -olive"><i class="v-icon " data-icon="sparkles"></i></span><span class="v-item__body"><span class="v-item__title" style="font-weight:500">Skill</span></span></button><button class="v-item" style="background:transparent;color:var(--v-on-ink);min-height:52px" data-close><span class="v-disk -lg -yellow"><i class="v-icon " data-icon="repeat"></i></span><span class="v-item__body"><span class="v-item__title" style="font-weight:500">Automation</span></span></button><button class="v-item" style="background:transparent;color:var(--v-on-ink);min-height:52px" data-close><span class="v-disk -lg -pink"><i class="v-icon " data-icon="pencil"></i></span><span class="v-item__body"><span class="v-item__title" style="font-weight:500">Quick note</span></span></button></div><button class="v-ibtn -pink -xl" data-close aria-label="Close" style="position:absolute;left:50%;bottom:-28px;transform:translateX(-50%)"><i class="v-icon " data-icon="x"></i></button></div></div></section>
<script src="../../assets/sprites.js"></script><script src="../../catalog/spec.js"></script><script src="../../js/v.js" data-base="../.."></script><script src="../../js/ui.js"></script><script src="../../js/flow.js"></script><script src="../../js/morph.js"></script><script src="../../js/motion.js"></script><script src="../../catalog/demo-behaviour.js"></script><script>(async()=>{await V.init(document.body);if(window.VUI)VUI.init(document.body);if(window.VLive)VLive.init(document.body)})()</script>
<script>document.querySelectorAll('[data-indeterminate]').forEach(i=>i.indeterminate=true);addEventListener('load',()=>document.documentElement.dataset.ready='1');</script>
</body></html>
