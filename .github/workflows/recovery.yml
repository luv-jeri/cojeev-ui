name: Isolated recovery check
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [beta, production]
        required: true
      slot:
        description: Weekday backup slot, 0 through 6
        type: choice
        options: ['0', '1', '2', '3', '4', '5', '6']
        required: true
permissions:
  contents: read
  issues: write
jobs:
  restore:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    concurrency:
      group: recovery-scratch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
      - name: Prepare pinned external runtime
        run: |
          mkdir -p "$RUNNER_TEMP/cojeev-wrangler"
          cp .github/wrangler-runtime/package*.json "$RUNNER_TEMP/cojeev-wrangler/"
          npm ci --ignore-scripts --prefix "$RUNNER_TEMP/cojeev-wrangler"
          echo "WRANGLER_BIN=$RUNNER_TEMP/cojeev-wrangler/node_modules/wrangler/bin/wrangler.js" >> "$GITHUB_ENV"
      - name: Verify private backup and restore only into empty scratch D1
        run: node scripts/operations.mjs restore "$TARGET" "$TARGET/day-$SLOT.sql"
        env:
          TARGET: ${{ inputs.environment }}
          SLOT: ${{ inputs.slot }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Independent failure notification
        if: failure()
        run: node scripts/operations-health.mjs "$TARGET"
        env:
          TARGET: ${{ inputs.environment }}
          GH_TOKEN: ${{ github.token }}
          UPDATE_ALERT: 'true'
          OPERATIONS_FAILURE: recovery-failed
