name: Operations health
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: operations-health
  cancel-in-progress: false
jobs:
  health:
    # Scheduled and manual runs stay disabled until the owner deliberately sets the
    # repository variable OPERATIONS_HEALTH_ENABLED to 'true'. A missing or false value
    # blocks workflow_dispatch as well. See docs/production/OPERATIONS.md.
    if: github.ref == 'refs/heads/main' && vars.OPERATIONS_HEALTH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: operations
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
      - name: Check beta and update sanitized alert
        run: node scripts/operations-health.mjs beta
        env:
          HEALTH_TOKEN: ${{ secrets.BETA_HEALTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          UPDATE_ALERT: 'true'
      - name: Check production and update sanitized alert
        if: always()
        run: node scripts/operations-health.mjs production
        env:
          HEALTH_TOKEN: ${{ secrets.PRODUCTION_HEALTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          UPDATE_ALERT: 'true'
